<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plugin platform</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f5f5f7;
    --surface:#ffffff;
    --surface-2:#fafafc;
    --surface-3:#f0f0f4;
    --text:#1d1d1f;
    --text-2:#6e6e73;
    --text-3:#86868b;
    --line:rgba(0,0,0,.075);
    --line-2:rgba(0,0,0,.14);
    --accent:#0071e3;
    --accent-hover:#0077ed;
    --accent-soft:#e9f2ff;
    --green:#1a7f37; --green-soft:#e8f6ec;
    --amber:#8a5a00; --amber-soft:#fff5e0;
    --red:#c0362c; --red-soft:#fdecea;
    --shadow-sm:0 1px 2px rgba(0,0,0,.05);
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 12px 32px -16px rgba(0,0,0,.18);
    --shadow-lg:0 24px 64px -24px rgba(0,0,0,.28);
    --r:18px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --surface:#1c1c1e;
      --surface-2:#242426;
      --surface-3:#2c2c2e;
      --text:#f5f5f7;
      --text-2:#a1a1a6;
      --text-3:#8e8e93;
      --line:rgba(255,255,255,.09);
      --line-2:rgba(255,255,255,.16);
      --accent:#0a84ff;
      --accent-hover:#409cff;
      --accent-soft:rgba(10,132,255,.16);
      --green:#30d158; --green-soft:rgba(48,209,88,.14);
      --amber:#ffd60a; --amber-soft:rgba(255,214,10,.13);
      --red:#ff453a; --red-soft:rgba(255,69,58,.14);
      --shadow-sm:0 1px 2px rgba(0,0,0,.5);
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 40px -20px rgba(0,0,0,.7);
      --shadow-lg:0 28px 72px -24px rgba(0,0,0,.9);
    }
  }
  html[data-theme="light"]{--bg:#f5f5f7;--surface:#fff;--surface-2:#fafafc;--surface-3:#f0f0f4;--text:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;--line:rgba(0,0,0,.075);--line-2:rgba(0,0,0,.14);--accent:#0071e3;--accent-hover:#0077ed;--accent-soft:#e9f2ff;--green:#1a7f37;--green-soft:#e8f6ec;--amber:#8a5a00;--amber-soft:#fff5e0;--red:#c0362c;--red-soft:#fdecea;color-scheme:light}
  html[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--surface-2:#242426;--surface-3:#2c2c2e;--text:#f5f5f7;--text-2:#a1a1a6;--text-3:#8e8e93;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);--accent:#0a84ff;--accent-hover:#409cff;--accent-soft:rgba(10,132,255,.16);--green:#30d158;--green-soft:rgba(48,209,88,.14);--amber:#ffd60a;--amber-soft:rgba(255,214,10,.13);--red:#ff453a;--red-soft:rgba(255,69,58,.14);color-scheme:dark}

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.5 var(--sans);
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.006em;
  }
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
  input,select,textarea{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;width:100%;outline:none;letter-spacing:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  ::selection{background:var(--accent-soft)}

  .app{display:grid;grid-template-columns:252px 1fr;height:100%}

  /* ── sidebar ── */
  .rail{
    border-right:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 68%, transparent);
    backdrop-filter:saturate(180%) blur(24px);
    -webkit-backdrop-filter:saturate(180%) blur(24px);
    display:flex;flex-direction:column;
    padding:20px 12px 14px;gap:20px;overflow:auto;
  }
  .brand{display:flex;gap:10px;align-items:center;padding:0 10px 4px}
  .brand .mark{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(160deg,#5ac8fa,#0071e3 55%,#5856d6);
    box-shadow:0 2px 10px rgba(0,113,227,.35);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;
  }
  .brand b{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .brand span{display:block;font-size:11px;color:var(--text-3);margin-top:-1px}

  .nav{display:flex;flex-direction:column;gap:1px}
  .nav i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--text-3);padding:14px 12px 5px}
  .nav button{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:7px 11px;border-radius:9px;color:var(--text);
    font-size:13.5px;text-align:left;transition:background .12s;
  }
  .nav button:hover{background:color-mix(in srgb, var(--text) 5%, transparent)}
  .nav button.on{background:var(--surface);box-shadow:var(--shadow-sm);font-weight:500}
  .nav button.on .ic{color:var(--accent)}
  .nav .ic{width:16px;text-align:center;color:var(--text-3);font-size:13px;flex:0 0 auto}
  .nav .count{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}

  .rail .foot{
    margin-top:auto;padding:12px 11px 4px;border-top:1px solid var(--line);
    display:grid;gap:7px;font-size:12px;color:var(--text-2);
  }
  .rail .foot .row{display:flex;align-items:center;justify-content:space-between}
  .rail .foot .row b{font-weight:500;color:var(--text)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft);display:inline-block;margin-right:6px}

  /* ── main ── */
  main{overflow:auto;padding:0 0 80px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 40px}
  @media(max-width:900px){.wrap{padding:0 22px}}

  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:16px 0 0;position:sticky;top:0;z-index:20;
    background:linear-gradient(color-mix(in srgb, var(--bg) 92%, transparent), color-mix(in srgb, var(--bg) 70%, transparent) 60%, transparent);
    backdrop-filter:blur(12px);
  }
  .guild{
    display:flex;align-items:center;gap:9px;padding:5px 13px 5px 6px;
    border-radius:999px;background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow-sm);font-size:13px;font-weight:500;
  }
  .guild .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;background:linear-gradient(150deg,#5ac8fa,#0071e3)}
  .guild em{font-style:normal;font-weight:400;color:var(--text-3);font-size:12px}
  .topbar .sp{flex:1}
  .iconbtn{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    color:var(--text-2);border:1px solid transparent;
  }
  .iconbtn:hover{background:var(--surface);border-color:var(--line);color:var(--text)}
  .me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
  .me .av{width:26px;height:26px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text-2)}

  /* headings */
  .head{display:flex;align-items:flex-end;gap:20px;padding:34px 0 22px}
  .head .txt{flex:1;min-width:0}
  .eyebrow{font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:6px}
  h1{font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.025em;margin:0}
  .lede{margin:9px 0 0;font-size:15px;color:var(--text-2);max-width:62ch;letter-spacing:-.01em}
  @media(max-width:640px){h1{font-size:26px}.head{flex-direction:column;align-items:flex-start;padding:26px 0 18px}}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:34px;padding:0 15px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line-2);
    font-size:13.5px;font-weight:500;color:var(--text);
    box-shadow:var(--shadow-sm);white-space:nowrap;transition:.12s;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.pri{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 2px 12px color-mix(in srgb, var(--accent) 35%, transparent)}
  .btn.pri:hover{background:var(--accent-hover)}
  .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.danger{color:var(--red);border-color:color-mix(in srgb, var(--red) 25%, transparent);background:var(--surface)}
  .btn.danger:hover{background:var(--red-soft)}
  .btn.sm{height:28px;padding:0 12px;font-size:12.5px}
  .btn:disabled{opacity:.4;pointer-events:none}
  .actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
  .pad{padding:20px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px}
  .card-h h2{font-size:13px;font-weight:600;margin:0;letter-spacing:-.005em}
  .card-h .sub{font-size:12px;color:var(--text-3)}

  /* metrics */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:860px){.metrics{grid-template-columns:repeat(2,1fr)}}
  .metric{padding:16px 18px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
  .metric .lbl{font-size:12px;color:var(--text-3);font-weight:500}
  .metric .val{font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums}
  .metric .val small{font-size:13px;font-weight:400;color:var(--text-3);letter-spacing:0}
  .metric .delta{font-size:12px;color:var(--text-3);margin-top:3px}

  .cols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px;align-items:start}
  @media(max-width:1000px){.cols{grid-template-columns:1fr}}
  .stack{display:grid;gap:16px}

  /* list rows */
  .rows{display:block}
  .row-item{
    display:flex;align-items:center;gap:13px;
    padding:12px 20px;border-top:1px solid var(--line);
    cursor:pointer;transition:background .1s;
  }
  .row-item:first-child{border-top:0}
  .row-item:hover{background:var(--surface-2)}
  .tile{
    width:38px;height:38px;border-radius:10px;flex:0 0 auto;
    display:grid;place-items:center;font-size:17px;
    background:var(--surface-3);border:1px solid var(--line);
  }
  .tile.lg{width:56px;height:56px;border-radius:15px;font-size:26px}
  .row-main{flex:1;min-width:0}
  .row-main .name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px}
  .row-main .meta{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:2px}
  .row-end{display:flex;align-items:center;gap:14px;color:var(--text-3);font-size:12.5px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .chev{color:var(--text-3);font-size:15px;opacity:.6}

  /* chips */
  .tag{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
  .tag.ok{background:var(--green-soft);color:var(--green)}
  .tag.warn{background:var(--amber-soft);color:var(--amber)}
  .tag.err{background:var(--red-soft);color:var(--red)}
  .tag.acc{background:var(--accent-soft);color:var(--accent)}
  .tag.code{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--text-2)}
  .pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}

  .mono{font-family:var(--mono);font-size:12px;font-variant-ligatures:none}
  .dim{color:var(--text-3)}
  .muted{color:var(--text-2)}
  .num{font-variant-numeric:tabular-nums}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .sec{font-size:12px;font-weight:600;color:var(--text-3);margin:0 0 8px}

  /* activity stream */
  .stream{padding:4px 0 10px;max-height:250px;overflow:auto;font-size:12.5px}
  .stream .ev{display:flex;gap:10px;align-items:baseline;padding:5px 20px;font-variant-numeric:tabular-nums}
  .stream .ev .t{color:var(--text-3);font-family:var(--mono);font-size:11px;flex:0 0 auto}
  .stream .ev .n{color:var(--accent);font-family:var(--mono);font-size:11.5px}
  .stream .ev .w{color:var(--text-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stream .ev .d{color:var(--text-3);font-family:var(--mono);font-size:11px}

  /* attention */
  .attn{display:flex;gap:11px;padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45}
  .attn:first-child{border-top:0}
  .attn b{font-weight:500}
  .attn .txt{color:var(--text-2)}

  /* tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;font-weight:500;color:var(--text-3);padding:10px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  th.r,td.r{text-align:right}
  .tblwrap{overflow-x:auto}

  /* segmented tabs */
  .segmented{display:inline-flex;gap:2px;padding:2px;background:var(--surface-3);border-radius:10px;margin:4px 0 18px}
  .segmented button{padding:5px 14px;border-radius:8px;font-size:13px;color:var(--text-2);transition:.15s;white-space:nowrap}
  .segmented button:hover{color:var(--text)}
  .segmented button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:var(--shadow-sm)}

  /* code */
  pre{
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0;overflow:auto;
    font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--text);
  }
  .hint{font-size:12px;color:var(--text-3);margin-top:8px;line-height:1.5}

  /* definition list */
  .dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px;align-items:baseline}
  .dl dt{color:var(--text-3);white-space:nowrap}
  .dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

  /* iOS switch */
  .switch{position:relative;display:inline-block;width:42px;height:25px;flex:0 0 auto}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch i{position:absolute;inset:0;background:var(--line-2);border-radius:99px;transition:background .2s;cursor:pointer}
  .switch i::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .switch input:checked + i{background:var(--green)}
  .switch input:checked + i::after{transform:translateX(17px)}
  .switch input:focus-visible + i{box-shadow:0 0 0 4px var(--accent-soft)}

  /* settings-style rows */
  .set-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
  .set-row:first-child{border-top:0}
  .set-row .l{flex:1;min-width:0}
  .set-row .l .t{font-size:13.5px;font-weight:500}
  .set-row .l .d{font-size:12px;color:var(--text-3);margin-top:1px;line-height:1.4}
  .set-row .ctl{flex:0 0 auto;width:190px}
  .set-row .ctl.wide{width:230px}
  @media(max-width:700px){.set-row{flex-wrap:wrap}.set-row .ctl{width:100%}}

  /* logs */
  .logs{background:var(--surface-2);border-radius:0 0 var(--r) var(--r);max-height:420px;overflow:auto;padding:10px 0;font-family:var(--mono);font-size:12px;line-height:1.75}
  .logs .ln{display:flex;gap:10px;padding:1px 18px}
  .logs .ln:hover{background:color-mix(in srgb, var(--text) 3%, transparent)}
  .logs .ln .t{color:var(--text-3);flex:0 0 auto}
  .logs .ln .s{color:var(--text-3);flex:0 0 auto}
  .logs .ln .lv{flex:0 0 auto;width:38px;font-weight:500}
  .logs .lv.info{color:var(--accent)} .logs .lv.ok{color:var(--green)} .logs .lv.warn{color:var(--amber)} .logs .lv.err{color:var(--red)}
  .logs .ln .m{color:var(--text-2);min-width:0;white-space:pre-wrap}

  /* wizard */
  .wiz{max-width:760px}
  .steps{display:flex;align-items:center;gap:0;margin:0 0 20px;font-size:12.5px;color:var(--text-3);flex-wrap:wrap;row-gap:8px}
  .steps .st{display:flex;align-items:center;gap:8px}
  .steps .st .n{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-2)}
  .steps .st.on{color:var(--text);font-weight:500}
  .steps .st.on .n{background:var(--accent);color:#fff}
  .steps .st.done .n{background:var(--green-soft);color:var(--green)}
  .steps .bar{width:26px;height:1px;background:var(--line-2);margin:0 10px}

  .check{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 0}
  .check .ok{width:18px;height:18px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:10px;flex:0 0 auto}
  .check .warn{width:18px;height:18px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;font-size:10px;flex:0 0 auto}

  .cap-row{display:flex;align-items:flex-start;gap:12px;padding:13px 20px;border-top:1px solid var(--line)}
  .cap-row:first-child{border-top:0}
  .cap-row .nm{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .cap-row .ds{font-size:12px;color:var(--text-3);margin-top:1px}
  .warnline{font-size:12px;color:var(--amber);margin-top:3px}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
    display:flex;align-items:center;gap:9px;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(20px);border:1px solid var(--line-2);
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.2s cubic-bezier(.32,.72,0,1);z-index:80;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast .g{color:var(--green)}

  /* view animation */
  .fade>*{animation:rise .4s cubic-bezier(.32,.72,0,1) both}
  .fade>*:nth-child(2){animation-delay:.03s}
  .fade>*:nth-child(3){animation-delay:.06s}
  .fade>*:nth-child(4){animation-delay:.09s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.fade>*{animation:none}}

  .empty{padding:44px 20px;text-align:center;color:var(--text-3);font-size:13px}
  .kv-chips{display:flex;flex-wrap:wrap;gap:6px}
  .bars{display:grid;gap:12px}
  .bar{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:12.5px;align-items:center}
  .bar .track{grid-column:1/-1;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
  .bar .track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  .back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--accent);margin-bottom:14px}
  .back:hover{text-decoration:underline}

  /* mobile: rail → top strip */
  @media(max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .rail{flex-direction:row;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
    .brand{padding:0;flex:0 0 auto}
    .brand div:last-child span{display:none}
    .brand b{display:none}
    .nav{flex-direction:row;gap:2px;align-items:center}
    .nav i{display:none}
    .nav button{white-space:nowrap;font-size:13px;padding:6px 10px}
    .nav .ic{display:none}
    .rail .foot{display:none}
    main{height:auto}
    .topbar{position:static;padding-top:12px}
    .head{padding:20px 0 16px}
    .metrics{grid-template-columns:1fr 1fr}
    .cols{grid-template-columns:1fr}
    .dl{grid-template-columns:1fr}
    .dl dd{text-align:left}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">◈</div>
      <div><b>Plugin Platform</b><span>protótipo</span></div>
    </div>
    <nav class="nav" id="nav">
      <i>Servidor</i>
      <button data-go="overview"><span class="ic">◷</span>Visão geral</button>
      <button data-go="plugins"><span class="ic">◫</span>Plugins<span class="count" id="nav-pl-count">0</span></button>
      <button data-go="logs"><span class="ic">≡</span>Logs</button>
      <i>Desenvolvimento</i>
      <button data-go="install"><span class="ic">↓</span>Instalar plugin</button>
      <button data-go="console"><span class="ic">⌘</span>Console JSON-RPC</button>
      <i>Plataforma</i>
      <button data-go="guilds"><span class="ic">◇</span>Guilds e permissões</button>
      <button data-go="protocol"><span class="ic">⌁</span>Protocolo</button>
    </nav>
    <div class="foot">
      <div class="row"><span><span class="dot"></span>Core online</span><b>6d 4h</b></div>
      <div class="row"><span>Versão</span><b>0.4.2</b></div>
      <div class="row"><span>Plugins ativos</span><b id="foot-active">0</b></div>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ───────────── dados mockados ───────────── */
const guilds = [
  { id: "1201", name: "Servidor Dev BR", initials: "DV", members: 2431, role: "owner" },
  { id: "1202", name: "Casinha do Gio", initials: "CG", members: 87, role: "owner" },
  { id: "1203", name: "Bot Lab", initials: "BL", members: 512, role: "admin" },
];

const plugins = [
  {
    id: "pets", name: "Pets", icon: "🐾", lang: "python", version: "1.4.2",
    repo: "github.com/devlucas/discord-pets", branch: "main", sha: "a91f2c7",
    runtime: { kind: "process", build: ["pip", "install", "-r", "requirements.txt"], cmd: ["python3", "main.py"] },
    status: "healthy", enabled: true, guilds: ["1201", "1202"],
    caps: ["reply", "kv", "economy.read", "scheduler"],
    commands: [{ name: "pet", desc: "Adota ou acaricia seu pet" }, { name: "petrank", desc: "Ranking de pets do servidor" }],
    events: ["MESSAGE_CREATE"],
    calls24h: 12480, p95: 41, errors24h: 3, kvKeys: 8120, mem: "38 MB", restarts: 0,
    schema: {
      cooldown: { type: "number", title: "Cooldown", hint: "Segundos entre interações", default: 30 },
      hunger_rate: { type: "number", title: "Fome por hora", hint: "Quanto a fome sobe a cada hora", default: 4 },
      announce_adoption: { type: "boolean", title: "Anunciar adoção no canal", hint: "Publica uma mensagem quando alguém adota um pet" },
    },
    config: { cooldown: 30, hunger_rate: 4, announce_adoption: true },
  },
  {
    id: "loja", name: "Loja", icon: "🛒", lang: "rust", version: "2.0.1",
    repo: "github.com/mari/loja-bot", branch: "release", sha: "77be004",
    runtime: { kind: "container", image: "ghcr.io/mari/loja:2.0.1", port: 8080 },
    status: "healthy", enabled: true, guilds: ["1201"],
    caps: ["reply", "kv", "economy.grant", "economy.read", "add_role"],
    commands: [{ name: "loja", desc: "Abre a loja" }, { name: "comprar", desc: "Compra um item" }],
    events: ["INTERACTION_CREATE"],
    calls24h: 3310, p95: 96, errors24h: 0, kvKeys: 1240, mem: "112 MB", restarts: 0,
    schema: {
      currency_name: { type: "string", title: "Nome da moeda", hint: "Aparece nas mensagens da loja", default: "coins" },
      tax_percent: { type: "number", title: "Taxa por venda", hint: "Percentual retido pela loja", default: 5 },
    },
    config: { currency_name: "coins", tax_percent: 5 },
  },
  {
    id: "economia", name: "Economia", icon: "🪙", lang: "core", version: "0.9.0",
    repo: "—", branch: "—", sha: "builtin",
    runtime: { kind: "core", cmd: [] },
    status: "healthy", enabled: true, guilds: ["*"],
    caps: ["economy"],
    commands: [{ name: "saldo", desc: "Mostra seu saldo" }, { name: "daily", desc: "Recompensa diária" }],
    events: [],
    calls24h: 40120, p95: 6, errors24h: 0, kvKeys: 2431, mem: "—", restarts: 0,
    schema: { daily_amount: { type: "number", title: "Valor do daily", hint: "Moedas dadas a cada 24h", default: 100 } },
    config: { daily_amount: 100 },
  },
  {
    id: "cassino", name: "Cassino", icon: "🎲", lang: "typescript", version: "0.6.0",
    repo: "github.com/joao/cassino", branch: "main", sha: "3d90aa1",
    runtime: { kind: "process", build: ["npm", "ci", "&&", "npm", "run", "build"], cmd: ["node", "dist/index.js"] },
    status: "degraded", enabled: true, guilds: ["1201", "1203"],
    caps: ["reply", "economy.grant", "kv"],
    commands: [{ name: "roleta", desc: "Aposta na roleta" }, { name: "caraoucoroa", desc: "Aposta no cara ou coroa" }],
    events: [],
    calls24h: 2180, p95: 2900, errors24h: 41, kvKeys: 380, mem: "64 MB", restarts: 6,
    schema: {
      max_bet: { type: "number", title: "Aposta máxima", hint: "Limite de moedas por aposta", default: 500 },
      house_edge: { type: "number", title: "Margem da casa", hint: "Percentual de vantagem da casa", default: 3 },
    },
    config: { max_bet: 500, house_edge: 3 },
  },
  {
    id: "moderacao", name: "Moderação", icon: "🛡", lang: "go", version: "1.1.0",
    repo: "github.com/botlab/moderacao", branch: "v1", sha: "c0ffee2",
    runtime: { kind: "process", cmd: ["./bin/mod"] },
    status: "stopped", enabled: false, guilds: ["1201"],
    caps: ["reply", "add_role", "kick", "kv"],
    commands: [{ name: "ban", desc: "Bane um membro" }, { name: "warn", desc: "Adverte um membro" }],
    events: ["MESSAGE_CREATE", "GUILD_MEMBER_ADD"],
    calls24h: 0, p95: 0, errors24h: 0, kvKeys: 91, mem: "—", restarts: 0,
    schema: { auto_role: { type: "string", title: "Cargo automático no join", hint: "ID do cargo dado a novos membros", default: "" } },
    config: { auto_role: "" },
  },
];

const allCaps = {
  reply: ["Responder em canais", "Envia mensagens no canal do evento."],
  replyEphemeral: ["Responder em privado", "Resposta visível só para quem interagiu."],
  editMessage: ["Editar mensagens", "Edita mensagens já enviadas pelo bot."],
  add_role: ["Gerenciar cargos", "Atribui e remove cargos dos membros."],
  kick: ["Expulsar membros", "Remove membros do servidor."],
  kv: ["Armazenamento KV", "Guarda dados no namespace do plugin e da guild."],
  "economy.read": ["Ler economia", "Consulta o saldo da moeda global."],
  "economy.grant": ["Alterar moeda", "Muda o saldo de membros — precisa de aprovação."],
  scheduler: ["Agendador", "Executa tarefas recorrentes, como fome de pets."],
  http: ["Rede externa", "Requisições para os domínios declarados."],
};

/* ───────────── utilitários ───────────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (n) => n.toLocaleString("pt-BR");
const langColor = { python: "#d9a521", rust: "#c96a3f", typescript: "#3b7dd8", go: "#1fa8a8", core: "#7a5cd6" };

const theme = (() => { try { return localStorage.getItem("theme") || ""; } catch { return ""; } })();
if (theme) document.documentElement.dataset.theme = theme;
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  render();
}

let curGuild = guilds[0].id;
let state = { view: "overview", plugin: null, tab: "overview", toastT: null };

function toast(msg) {
  const t = $("#toast");
  t.innerHTML = `<span class="g">✓</span>${esc(msg)}`;
  t.className = "toast on";
  clearTimeout(state.toastT);
  state.toastT = setTimeout(() => (t.className = "toast"), 2300);
}

function statusTag(p) {
  if (!p.enabled) return `<span class="tag">desativado</span>`;
  if (p.status === "healthy") return `<span class="tag ok"><i class="pill-dot"></i>healthy</span>`;
  if (p.status === "degraded") return `<span class="tag warn"><i class="pill-dot"></i>degradado</span>`;
  return `<span class="tag err"><i class="pill-dot"></i>parado</span>`;
}
function runtimeTag(p) {
  if (p.runtime.kind === "core") return `<span class="tag acc">core</span>`;
  const label = p.runtime.kind === "container"
    ? p.runtime.image.split("/").pop()
    : "process";
  return `<span class="tag code">${p.runtime.kind === "container" ? "▣ " : "⌘ "}${esc(label)}</span>`;
}
function langDot(l) {
  return `<span style="width:6px;height:6px;border-radius:50%;background:${langColor[l] || "#999"};display:inline-block"></span>`;
}

function shell(head, body) {
  return `<div class="topbar">${guildPicker()}<div class="sp"></div>
      <button class="iconbtn" data-act="theme" title="Alternar aparência">${document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches) ? "☀" : "☾"}</button>
      <div class="me"><div class="av">GM</div>giovanni</div>
    </div>
    <div class="fade">${head}${body}</div>`;
}

function guildPicker() {
  const g = guilds.find((x) => x.id === curGuild) || guilds[0];
  return `<div class="guild"><div class="av">${g.initials}</div>${esc(g.name)} <em>${nf(g.members)}</em></div>`;
}

function pageHead(title, lede, actions) {
  return `<div class="head"><div class="txt"><h1>${esc(title)}</h1>${lede ? `<p class="lede">${lede}</p>` : ""}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
}

/* ───────────── visão geral ───────────── */
function viewOverview() {
  const active = plugins.filter((p) => p.enabled);
  const calls = plugins.reduce((a, p) => a + p.calls24h, 0);
  const errs = plugins.reduce((a, p) => a + p.errors24h, 0);
  const kv = plugins.reduce((a, p) => a + p.kvKeys, 0);

  const head = pageHead("Visão geral", "O que está rodando neste servidor agora.", `<button class="btn pri" data-go="install">Instalar plugin</button>`);

  const metrics = `<div class="metrics">
    <div class="metric"><div class="lbl">Plugins ativos</div><div class="val">${active.length}<small> de ${plugins.length}</small></div><div class="delta">1 desativado manualmente</div></div>
    <div class="metric"><div class="lbl">Chamadas · 24h</div><div class="val">${nf(calls)}</div><div class="delta">p95 geral 41 ms</div></div>
    <div class="metric"><div class="lbl">Erros · 24h</div><div class="val" style="color:${errs ? "var(--amber)" : "var(--green)"}">${nf(errs)}</div><div class="delta">${errs} vindos do cassino</div></div>
    <div class="metric"><div class="lbl">Chaves KV</div><div class="val">${nf(kv)}</div><div class="delta">3 namespaces</div></div>
  </div>`;

  const list = `<section class="card">
    <div class="card-h"><h2>Plugins instalados</h2><span class="sub">${plugins.length} no total</span></div>
    <div class="rows">${plugins.map(pluginRow).join("")}</div>
  </section>`;

  const side = `<div class="stack">
    <section class="card">
      <div class="card-h"><h2>Atividade</h2><span class="sub"><i class="pill-dot" style="color:var(--green)"></i> ao vivo</span></div>
      <div class="stream" id="ev-stream"></div>
    </section>
    <section class="card">
      <div class="card-h"><h2>Precisa de atenção</h2></div>
      <div class="attn"><span class="tag warn">degradado</span><div class="txt"><b>Cassino</b> reiniciou 6 vezes e passa de 2,9 s no p95. O timeout é de 3 s.</div></div>
      <div class="attn"><span class="tag">parado</span><div class="txt"><b>Moderação</b> está desativada há 3 dias.</div></div>
      <div class="attn"><span class="tag acc">atualização</span><div class="txt"><b>Pets</b> tem a versão 1.5.0 no repositório.</div></div>
    </section>
  </div>`;

  return shell(head, metrics + `<div class="cols">${list}${side}</div>`);
}

function pluginRow(p) {
  const mem = p.mem !== "—" ? ` · ${p.mem}` : "";
  return `<div class="row-item" data-plugin="${p.id}" role="button" tabindex="0">
    <div class="tile">${p.icon}</div>
    <div class="row-main">
      <div class="name">${esc(p.name)} <span class="dim" style="font-weight:400;font-size:12px">v${p.version}</span></div>
      <div class="meta">${langDot(p.lang)} ${esc(p.lang)} ${runtimeTag(p)} ${statusTag(p)}</div>
    </div>
    <div class="row-end"><span>${nf(p.calls24h)}<span class="dim"> chamadas${mem}</span></span><span class="chev">›</span></div>
  </div>`;
}

/* ───────────── plugins ───────────── */
function viewPlugins() {
  const head = pageHead("Plugins", "Cada plugin roda isolado, com permissões declaradas e aprovadas.", `<button class="btn pri" data-go="install">Instalar plugin</button>`);
  const body = `<section class="card tblwrap">
    <table>
      <thead><tr><th>Plugin</th><th>Runtime</th><th>Status</th><th>Permissões</th><th class="r">Chamadas</th><th class="r">p95</th><th class="r">Erros</th><th></th></tr></thead>
      <tbody>
      ${plugins.map((p) => `
        <tr>
          <td style="cursor:pointer" data-plugin="${p.id}">
            <div style="display:flex;align-items:center;gap:10px">
              <div class="tile" style="width:30px;height:30px;border-radius:8px;font-size:14px">${p.icon}</div>
              <div>
                <div style="font-weight:500">${esc(p.name)}</div>
                <div class="dim mono" style="font-size:11px">${p.repo === "—" ? "builtin" : esc(p.sha)} · ${esc(p.lang)}</div>
              </div>
            </div>
          </td>
          <td>${runtimeTag(p)}</td>
          <td>${statusTag(p)}</td>
          <td><div class="kv-chips">${p.caps.slice(0, 2).map((c) => `<span class="tag code">${esc(c)}</span>`).join("")}${p.caps.length > 2 ? `<span class="tag code">+${p.caps.length - 2}</span>` : ""}</div></td>
          <td class="r num mono">${nf(p.calls24h)}</td>
          <td class="r num mono" style="color:${p.p95 > 500 ? "var(--amber)" : "var(--text-2)"}">${p.p95 ? p.p95 + " ms" : "—"}</td>
          <td class="r num mono" style="color:${p.errors24h ? "var(--red)" : "var(--text-3)"}">${p.errors24h}</td>
          <td class="r"><button class="btn sm" data-plugin="${p.id}">Abrir</button></td>
        </tr>`).join("")}
      </tbody>
    </table>
  </section>`;
  return shell(head, body);
}

/* ───────────── detalhe do plugin ───────────── */
function viewPlugin(id) {
  const p = plugins.find((x) => x.id === id);
  if (!p) return viewPlugins();

  const head = `<a class="back" data-go="plugins">‹ Plugins</a>
    <div class="head" style="padding-top:0">
      <div class="tile lg">${p.icon}</div>
      <div class="txt">
        <h1 style="font-size:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">${esc(p.name)} ${statusTag(p)}</h1>
        <div class="dim mono" style="font-size:12px;margin-top:5px">${p.repo === "—" ? "builtin" : esc(p.repo) + " · " + esc(p.branch) + " · " + esc(p.sha)} · v${p.version}</div>
      </div>
      <div class="actions">
        <label class="switch" title="Ativar ou desativar"><input type="checkbox" data-act="toggle" data-id="${p.id}" ${p.enabled ? "checked" : ""} aria-label="Ativar plugin"><i></i></label>
        <button class="btn danger" data-act="kill" data-id="${p.id}">Parar agora</button>
      </div>
    </div>
    <div class="segmented">
      ${[["overview", "Visão geral"], ["config", "Configuração"], ["protocol", "Protocolo"], ["logs", "Logs"]]
        .map(([k, l]) => `<button class="${state.tab === k ? "on" : ""}" data-tab="${k}" data-id="${p.id}">${l}</button>`).join("")}
    </div>
    <div id="tab-body">${pluginTab(p, state.tab)}</div>`;
  return shell(head, "");
}

function pluginTab(p, tab) {
  if (tab === "config") {
    const rows = Object.entries(p.schema).map(([k, s]) => {
      const v = p.config[k];
      const ctl = s.type === "boolean"
        ? `<label class="switch"><input type="checkbox" id="cfg-${k}" ${v ? "checked" : ""}><i></i></label>`
        : `<input id="cfg-${k}" type="${s.type === "number" ? "number" : "text"}" value="${esc(v ?? "")}" aria-label="${esc(s.title)}">`;
      return `<div class="set-row">
        <label class="l" for="cfg-${k}"><div class="t">${esc(s.title)}</div><div class="d">${esc(s.hint || "")}</div></label>
        <div class="ctl">${ctl}</div>
      </div>`;
    }).join("");

    return `<div class="cols">
      <section class="card">
        <div class="card-h"><h2>Configuração</h2><span class="sub">gerada do manifesto</span></div>
        ${rows || '<div class="empty">Este plugin não declara configuração.</div>'}
        <div class="set-row" style="justify-content:flex-end;gap:9px;background:var(--surface-2);border-radius:0 0 var(--r) var(--r)">
          <span class="dim" style="font-size:12px;margin-right:auto">O core reenvia <span class="mono">initialize</span> sem reiniciar o processo.</span>
          <button class="btn" data-act="reset">Reverter</button>
          <button class="btn pri" data-act="save" data-id="${p.id}">Salvar</button>
        </div>
      </section>
      <div class="stack">
        <section class="card pad">
          <h2 class="sec">Configuração efetiva</h2>
          <pre>${esc(JSON.stringify(p.config, null, 2))}</pre>
        </section>
        <section class="card pad">
          <h2 class="sec">Como aplica</h2>
          <dl class="dl">
            <dt>Por guild</dt><dd>sobrescreve padrões</dd>
            <dt>Segredos</dt><dd>via ambiente</dd>
            <dt>Recarga</dt><dd>sem restart</dd>
          </dl>
        </section>
      </div>
    </div>`;
  }

  if (tab === "logs") {
    return `<section class="card">
      <div class="card-h"><h2>Logs de ${esc(p.name)}</h2><div style="display:flex;gap:8px;align-items:center"><span class="tag ok"><i class="pill-dot"></i>ao vivo</span><button class="btn sm" data-act="clearlogs">Limpar</button></div></div>
      <div class="logs" id="plog">${logLines(p)}</div>
    </section>
    <p class="hint">O plugin escreve logs em <span class="mono">stderr</span>. O core prefixa cada linha com guild e <span class="mono">request_id</span>.</p>`;
  }

  if (tab === "protocol") {
    return `<div class="cols">
      <section class="card pad">
        <h2 class="sec">Manifesto</h2>
        <pre>${esc(manifestOf(p))}</pre>
      </section>
      <div class="stack">
        <section class="card">
          <div class="card-h"><h2>Testar chamada</h2><span class="sub">contra o mock</span></div>
          <div class="pad" style="padding-top:0;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn sm" data-act="rpc" data-m="handleCommand">handleCommand</button>
            <button class="btn sm" data-act="rpc" data-m="handleEvent">handleEvent</button>
            <button class="btn sm" data-act="rpc" data-m="health">health</button>
          </div>
          <div class="pad" style="padding-top:0"><pre id="rpc-out" style="min-height:150px">${esc(JSON.stringify({ jsonrpc: "2.0", note: "escolha um método para executar" }, null, 2))}</pre></div>
        </section>
        <p class="hint">No core real, isto vira stdio (process) ou <span class="mono">POST /rpc</span> (container).</p>
      </div>
    </div>`;
  }

  return `<div class="metrics" style="grid-template-columns:repeat(4,1fr)">
      <div class="metric"><div class="lbl">Chamadas · 24h</div><div class="val" style="font-size:23px">${nf(p.calls24h)}</div></div>
      <div class="metric"><div class="lbl">p95</div><div class="val" style="font-size:23px;color:${p.p95 > 500 ? "var(--amber)" : "inherit"}">${p.p95 ? p.p95 + `<small> ms</small>` : "—"}</div></div>
      <div class="metric"><div class="lbl">Erros · 24h</div><div class="val" style="font-size:23px;color:${p.errors24h ? "var(--red)" : "var(--green)"}">${p.errors24h}</div></div>
      <div class="metric"><div class="lbl">Memória</div><div class="val" style="font-size:23px">${p.mem.replace(" MB", `<small> MB</small>`)}</div></div>
    </div>
    <div class="cols" style="margin-top:16px">
      <div class="stack">
        <section class="card">
          <div class="card-h"><h2>Comandos</h2><span class="sub">${p.commands.length}</span></div>
          ${p.commands.map((c) => `<div class="set-row"><div class="l"><div class="t mono" style="font-size:13px">/${esc(c.name)}</div><div class="d">${esc(c.desc)}</div></div></div>`).join("")}
        </section>
        <section class="card">
          <div class="card-h"><h2>Eventos assinados</h2></div>
          <div class="pad" style="padding-top:0"><div class="kv-chips">${p.events.length ? p.events.map((e) => `<span class="tag code">${esc(e)}</span>`).join("") : '<span class="dim" style="font-size:12.5px">Nenhum — o plugin só responde a comandos.</span>'}</div></div>
        </section>
        <section class="card">
          <div class="card-h"><h2>Permissões aprovadas</h2></div>
          <div class="pad" style="padding-top:0"><div class="kv-chips">${p.caps.map((c) => `<span class="tag code">${esc(c)}</span>`).join("")}</div></div>
        </section>
      </div>
      <div class="stack">
        <section class="card pad">
          <h2 class="sec">Runtime</h2>
          <dl class="dl">

function manifestOf(p) {
  return `name = "${p.id}"
version = "${p.version}"
capabilities = [${p.caps.map((c) => `"${c}"`).join(", ")}]
events = [${p.events.map((e) => `"${e}"`).join(", ")}]
commands = [
${p.commands.map((c) => `  { name = "${c.name}", description = "${c.desc}" },`).join("\n")}
]

[runtime]
kind = "${p.runtime.kind}"${p.runtime.cmd && p.runtime.cmd.length ? `\ncmd  = ${JSON.stringify(p.runtime.cmd)}` : ""}${p.runtime.build ? `\nbuild = ${JSON.stringify(p.runtime.build)}` : ""}${p.runtime.image ? `\nimage = "${p.runtime.image}"\nport  = ${p.runtime.port}` : ""}`;
}

function logLines(p) {
  const base = [
    ["info", "initialize · guild=1201 · config aplicada"],
    ["ok", "handleCommand /" + (p.commands[0]?.name || "ping") + " · 41ms · 1 action"],
    ["info", "handleEvent MESSAGE_CREATE · 12ms · 0 actions"],
    ["ok", "kv.set pet:4410 · 3ms"],
  ];
  if (p.status === "degraded") base.push(["err", "timeout após 3000ms · request_id=8f2a1c · processo encerrado"], ["warn", "reinício 7 de 3 · espera 8s"], ["info", "processo saiu com código 137 · SIGKILL"]);
  if (!p.enabled) base.push(["warn", "processo parado pelo administrador"]);
  return base.map(([lvl, msg]) => {
    const t = `12:0${Math.floor(Math.random() * 9)}:${Math.floor(Math.random() * 59).toString().padStart(2, "0")}`;
    return `<div class="ln"><span class="t">${t}</span><span class="s">[1201]</span><span class="lv ${lvl}">${lvl.toUpperCase()}</span><span class="m">${esc(msg)}</span></div>`;
  }).join("");
}

function conSend() {
  con.plugin = $("#con-plugin").value;
  const req = JSON.parse($("#con-req").value);
  con.method = req.method;
  const p = plugins.find((x) => x.id === con.plugin);
  let out;
  if (!p.enabled) out = { error: { code: -32000, message: "E_PLUGIN_DISABLED" } };
  else if (con.method === "initialize") out = { result: [], note: `manifesto ${p.id}@${p.version} aceito, configuração aplicada` };
  else if (con.method === "health") out = { result: [] };
  else if (con.method === "handleEvent") out = { result: [{ type: "emit", topic: `${p.id}.xp`, payload: { userId: req.params.payload.userId, amount: 1 } }] };
  else out = { result: [{ type: "reply", content: "**Bilu** · fome 3 de 10 · felicidade 8 de 10" }, { type: "kv.set", key: `pet:${req.params.userId}`, value: { name: "Bilu", hunger: 3 } }] };
  con.out = JSON.stringify({ jsonrpc: "2.0", id: req.id, ...out }, null, 2);
  render();
}

function render() {
  const v = state.view;
  let html;
  if (v === "overview") html = viewOverview();
  else if (v === "plugins") html = viewPlugins();
  else if (v === "plugin") html = viewPlugin(state.plugin);
  else if (v === "install") html = viewInstall();

  if (v === "overview") startEvStream();
  if (v === "logs") startLogStream();
}

let evT = null, logT = null;
function stopStreams() { clearInterval(evT); clearInterval(logT); evT = logT = null; }

function startEvStream() {
  stopStreams();
  const events = ["MESSAGE_CREATE", "INTERACTION_CREATE", "GUILD_MEMBER_ADD", "MESSAGE_CREATE", "PRESENCE_UPDATE"];
  const targets = ["pets", "loja", "cassino", "moderacao"];
  const add = () => {
    const el = $("#ev-stream");
    if (!el) return stopStreams();
    const e = events[Math.floor(Math.random() * events.length)];
    const t = targets[Math.floor(Math.random() * targets.length)];
    const ms = (Math.random() * 60 + 4).toFixed(0);
    el.insertAdjacentHTML("beforeend", `<div class="ev"><span class="t">${new Date().toTimeString().slice(0, 8)}</span><span class="n">${e}</span><span class="w">→ ${t}</span><span class="d">${ms} ms</span></div>`);
    while (el.children.length > 16) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  };
  for (let i = 0; i < 7; i++) add();
  evT = setInterval(add, 1500);
}

function startLogStream() {
  stopStreams();
  const msgs = [
    ["pets", "ok", "handleCommand /pet · 38ms · 1 action"],
    ["loja", "ok", "handleCommand /comprar · 84ms · 2 actions"],
    ["cassino", "warn", "p95 acima do limite · 2900ms · request_id 8f2a1c"],
    ["pets", "info", "kv.set pet:4410 · 3ms"],
    ["economia", "info", "daily · guild 1201 · 100 moedas · 14 membros"],
    ["loja", "ok", "addRole userId 8891 roleId 555"],
    ["cassino", "err", "E_TIMEOUT · request_id 9c11d2 · processo encerrado · reinício 1 de 3"],
  ];
  const add = () => {
    const el = $("#log-stream");
    if (!el) return stopStreams();
    const [src, lvl, msg] = msgs[Math.floor(Math.random() * msgs.length)];
    el.insertAdjacentHTML("beforeend", `<div class="ln"><span class="t">${new Date().toTimeString().slice(0, 8)}</span><span class="s">[${src}]</span><span class="lv ${lvl}">${lvl.toUpperCase()}</span><span class="m">${esc(msg)}</span></div>`);
    while (el.children.length > 200) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  };
  for (let i = 0; i < 14; i++) add();
  logT = setInterval(add, 1200);
}

/* ───────────── eventos ───────────── */
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) {
    const next = go.dataset.go;
    if (next === "install" && state.view !== "install" && wiz.step !== 1) {
      clearInterval(wiz.timer);
      wiz = { step: 1, url: "", manifest: null, perms: {}, logs: [], timer: null, done: false };
    }
    state.view = next; state.plugin = null; render(); return;
  }

  const pl = e.target.closest("[data-plugin]");
  if (pl && !e.target.closest("[data-act]")) {
    state.view = "plugin"; state.plugin = pl.dataset.plugin; state.tab = "overview"; render(); return;
  }

  const tab = e.target.closest("[data-tab]");
  if (tab) {
    state.tab = tab.dataset.tab;
    const p = plugins.find((x) => x.id === tab.dataset.id);
    $("#tab-body").innerHTML = pluginTab(p, state.tab);
    $$(".segmented button").forEach((b) => b.classList.toggle("on", b === tab));
    return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  const p = plugins.find((x) => x.id === act.dataset.id);

  if (a === "theme") toggleTheme();
  else if (a === "toggle") {
    p.enabled = act.checked;
    p.status = p.enabled ? "healthy" : "stopped";
    toast(`${p.name} ${p.enabled ? "ativado" : "desativado"}`);
    render();
  } else if (a === "kill") {
    p.enabled = false; p.status = "stopped";
    toast(`${p.name} parado. Eventos descartados.`);
    render();
  } else if (a === "save") toast(`Configuração de ${p.name} aplicada`);
  else if (a === "reset") render();
  else if (a === "clearlogs") {
    const el = $("#plog"); if (el) el.innerHTML = '<div class="ln"><span class="m dim">— vazio —</span></div>';
  } else if (a === "rpc") {
    const m = act.dataset.m;
    const out = { jsonrpc: "2.0", id: 1, result: m === "handleCommand" ? [{ type: "reply", content: "**Bilu** · fome 3 de 10" }] : [] };
    const el = $("#rpc-out"); if (el) el.textContent = JSON.stringify(out, null, 2);
  } else if (a === "wiz-next") wizNext();
  else if (a === "wiz-back") { wiz.step = Math.max(1, wiz.step - 1); render(); }
  else if (a === "wiz-perms") { wiz.step = 3; render(); }
  else if (a === "wiz-build") wizBuild();
  else if (a === "wiz-done") { wiz.step = 5; render(); }
  else if (a === "wiz-reset") { wiz = { step: 1, url: "", manifest: null, perms: {}, logs: [], timer: null, done: false }; render(); }
  else if (a === "con-send") {
    try { conSend(); } catch { toast("JSON inválido na requisição"); }
  }
});

render();
</script>
