function guideForAI() {
  const prompt = `Você vai criar um plugin para a plugin platform (bot Discord em Node, plugins em
qualquer linguagem). Não invente SDK: o contrato inteiro está abaixo.

REGRAS
- O plugin é um processo. Fala JSON-RPC 2.0 em NDJSON: uma mensagem JSON por linha.
- Lê do stdin, escreve no stdout. Log vai no stderr, nunca em stdout.
- Nunca vê o token do Discord. Devolve Action[] e o core executa.
- Sem dependência externa a menos que seja indispensável.
- O manifesto plugin.toml é a fonte da verdade.

ARQUIVOS A CRIAR
- plugin.toml
- <entrypoint> (main.py / main.js / main.go / ...)
- README.md curto

MANIFESTO
name = "<id>"              # ^[a-z0-9_-]{1,32}$ — minúsculo, sem acento
display_name = "<Nome>"
version = "1.0.0"
description = "<uma frase>"
lang = "<python|javascript|typescript|go|ruby|java|...>"
capabilities = ["reply"]   # + "kv", "economy.read", "economy.grant" se precisar

[[commands]]
name = "<comando>"
description = "<o que faz>"

[runtime]
kind = "process"
cmd = ["<interpretador>", "<arquivo>"]
timeout_ms = 3000

MÉTODOS QUE O CORE CHAMA (responder sempre com o mesmo "id")
initialize    {pluginId, version, guilds:[{id,config}], capabilities, core} -> {ok:true}
handleCommand {command, args[], userId, guildId, channelId, messageId, isInteraction}
              -> Action[]
handleEvent   {type, guildId, payload} -> Action[]
health        {} -> {ok:true, detail?}
shutdown      {reason} -> {ok:true} (e encerrar)

MÉTODOS QUE O PLUGIN CHAMA (só com a capability aprovada)
kv.get        {guildId, key} -> {value}
kv.set        {guildId, key, value} -> {ok:true}
kv.del        {guildId, key} -> {deleted}
kv.keys       {guildId, prefix?} -> {keys:[]}
kv.incr       {guildId, key, by?} -> {value}
economy.get   {guildId, userId} -> {balance}
economy.grant {guildId, userId, amount, reason?} -> {balance}
economy.top   {guildId, limit?} -> {entries:[{userId,balance}]}
config.get    {guildId} -> {config}
log           {level, message} -> {ok:true}
http.fetch    {url, method?, body?, headers?} -> {status, body}  # só hosts em allowed_hosts

ACTIONS (a resposta de comando/evento é uma lista destas)
{type:"reply", content, ephemeral?}          cap: reply
{type:"editMessage", messageId, content}     cap: editMessage
{type:"addRole", userId, roleId}             cap: addRole
{type:"removeRole", userId, roleId}          cap: addRole
{type:"kick", userId, reason?}               cap: kick
{type:"emit", topic, payload}                cap: emit
{type:"schedule", in:"10m", run}             cap: scheduler

ERROS
-32001 E_TIMEOUT   -32002 E_CRASH     -32003 E_CAPABILITY
-32004 E_PROTOCOL  -32005 E_INVALID_ACTION

ENTREGUE
1. plugin.toml válido
2. o código do loop, com try/catch por mensagem para uma linha ruim não matar o processo
3. README com: como rodar o teste de conformidade e como instalar

VERIFICAÇÃO
  node core/cli.js conformance <dir>
  node core/cli.js install <dir> --guild=<id>
  node core/cli.js simulate <plugin> <comando>`;

  return `<div class="doc">
    <p class="lede" style="margin:0 0 2px">Cole o prompt abaixo numa IA, junto com a ideia do plugin. Ela sai com o manifesto, o loop e o README no formato que o core aceita — sem inventar API.</p>
  </div>

  ${step(1, "Prompt pronto",
    code(prompt),
    `<div class="callout"><b>Substitua</b> <code>&lt;id&gt;</code>, <code>&lt;comando&gt;</code> e o entrypoint pelo que você quer. Se o plugin precisa guardar dados, peça a capability <code>kv</code> e explique o que guardar — assim a IA usa <code>kv.get</code>/<code>kv.set</code> em vez de inventar banco.</div>`,
  )}

  ${step(2, "O esqueleto do loop, sem invenção",
    `<p>Se a IA enrolar, este é o formato exato. A regra é: parseia a linha, trata, responde com o mesmo <code>id</code>. Exceção numa mensagem não pode matar o processo.</p>`,
    code(`#!/usr/bin/env python3
import json, sys

def send(obj):
    sys.stdout.write(json.dumps(obj) + "\\n")
    sys.stdout.flush()

def log(msg):
    sys.stderr.write(msg + "\\n")

COMMANDS = {
    "contar": lambda p: [{"type": "reply", "content": "pong"}],
}

for line in sys.stdin:
    line = line.strip()
    if not line:
        continue
    try:
        msg = json.loads(line)
    except json.JSONDecodeError:
        log("linha inválida")          # nunca derruba o processo
        continue

    method, params, mid = msg.get("method"), msg.get("params") or {}, msg.get("id")
    try:
        if method == "initialize":
            result = {"ok": True}
        elif method == "handleCommand":
            fn = COMMANDS.get(params.get("command"))
            result = fn(params) if fn else [{"type": "reply", "content": "comando desconhecido"}]
        elif method == "handleEvent":
            result = []
        elif method == "health":
            result = {"ok": True}
        elif method == "shutdown":
            send({"jsonrpc": "2.0", "id": mid, "result": {"ok": True}})
            break
        else:
            send({"jsonrpc": "2.0", "id": mid, "error": {"code": -32601, "message": "método desconhecido: " + str(method)}})
            continue
        send({"jsonrpc": "2.0", "id": mid, "result": result})
    except Exception as exc:
        log("erro em " + str(method) + ": " + str(exc))
        send({"jsonrpc": "2.0", "id": mid, "error": {"code": -32000, "message": str(exc)}})`),
  )}

  ${step(3, "Chamar o core de dentro do handler",
    `<p>Guardar dado é uma chamada, não um import. Escreva no stdout e leia a resposta do stdin — na mesma thread, com um <code>id</code> que você inventou.</p>`,
    code(`_seq = 0

def core(method, params):
    global _seq
    _seq += 1
    rid = "p" + str(_seq)
    send({"jsonrpc": "2.0", "id": rid, "method": method, "params": params})
    while True:
        line = sys.stdin.readline()
        if not line:
            raise RuntimeError("core fechou a conexão")
        msg = json.loads(line)
        if "method" in msg:            # o core chamando durante nossa espera
            send({"jsonrpc": "2.0", "id": msg["id"], "result": {"ok": True}})
            continue
        if msg.get("id") != rid:
            continue
        if "error" in msg:
            raise RuntimeError(msg["error"].get("message", "erro no core"))
        return msg.get("result") or {}

# uso dentro do handler
total = core("kv.get", {"guildId": gid, "key": "count:" + uid}).get("value") or 0
core("kv.set", {"guildId": gid, "key": "count:" + uid, "value": total + 1})`),
    `<div class="callout"><b>Precisa de async?</b> O modelo é o mesmo: um mapa de <code>id → promise</code> e um leitor de linha que resolve. Veja <code>plugins/economia/main.js</code>, que faz exatamente isso em JS puro.</div>`,
  )}

  ${step(4, "Checklist antes de dizer que terminou",
    code(`node core/cli.js conformance <dir>        # 6 checagens de protocolo
node core/cli.js install <dir> --guild=<id>  # instala e registra os slash commands
node core/cli.js simulate <plugin> <cmd>     # dispara sem Discord`),
    `<ul>
      <li>stdout só tem JSON — nenhum <code>print</code> de debug.</li>
      <li>Toda mensagem recebida tem resposta com o mesmo <code>id</code>.</li>
      <li>Linha malformada é ignorada, não derruba o processo.</li>
      <li>O que o plugin devolve só usa capabilities declaradas no manifesto.</li>
      <li>Nome de comando minúsculo, sem acento, até 32 caracteres.</li>
      <li><code>timeout_ms</code> compatível com o trabalho: 3 s é o padrão.</li>
    </ul>`,
  )}
</div>`;
}

function viewLogs() {
  const opts = plugins.map((p) => `<option value="${p.id}">${p.id}</option>`).join("");
  const head = pageHead("Logs", "Fluxo único de todos os plugins, correlacionado por request_id.", "", "Servidor");
  const body = `<section class="card">
    <div class="card-h"><h2>Todos os plugins</h2><div style="display:flex;gap:10px;align-items:center">
      <select id="log-src" style="width:auto;height:24px;padding:0 6px;font-size:12px"><option value="">todos</option>${opts}</select>
      <select id="log-lvl" style="width:auto;height:24px;padding:0 6px;font-size:12px"><option value="">todos os níveis</option><option value="info">info</option><option value="warn">aviso</option><option value="error">erro</option></select>
      <button class="btn sm" data-act="refresh-logs">Atualizar</button>
      <span class="sub"><i class="dot"></i>${apiOnline ? "Ao vivo" : "Demonstração"}</span></div></div>
    <div class="logs" id="log-stream" style="max-height:440px;border-top:1px solid var(--line)"></div>
  </section>`;
  return shell(head, body);
}

function logRow(r) {
  const t = new Date(r.ts).toTimeString().slice(0, 8);
  const lvl = r.level === "error" ? "err" : r.level === "warn" ? "warn" : "info";
  return `<div class="ln"><span class="t">${t}</span><span class="s">[${esc(r.pluginId || "core")}]</span><span class="lv ${lvl}">${lvl.toUpperCase()}</span><span class="m">${esc(r.message)}</span></div>`;
}

async function fillLogs() {
  const el = $("#log-stream");
  if (!el) return;
  if (!apiOnline) { el.innerHTML = logLines({ commands: [{ name: "ping" }], status: "healthy", enabled: true }); return; }

  const src = $("#log-src")?.value || "";
  const lvl = $("#log-lvl")?.value || "";
  const rows = await api(`/api/logs?limit=200${src ? `&plugin=${src}` : ""}${lvl ? `&level=${lvl}` : ""}`).catch(() => []);
  el.innerHTML = rows.length
    ? rows.map(logRow).join("")
    : '<div class="ln"><span class="m dim">sem registros</span></div>';
}

async function fillPluginLogs(id) {
  const el = $("#plog");
  if (!el) return;
  if (!apiOnline) return;
  const rows = await api(`/api/plugins/${id}/logs?limit=100`).catch(() => []);
  el.innerHTML = rows.length
    ? rows.map(logRow).join("")
    : '<div class="ln"><span class="m dim">sem registros ainda</span></div>';
}

/** Atividade da visão geral: lê os logs reais e mostra o mais recente. */
async function startEvStream() {
  stopStreams();
  const el = () => $("#ev-stream");

  if (!apiOnline) {
    const events = ["MESSAGE_CREATE", "INTERACTION_CREATE", "GUILD_MEMBER_ADD", "CUSTOM"];
    const targets = plugins.map((p) => p.id);
    for (let i = 0; i < 7; i++) {
      const e = events[Math.floor(Math.random() * events.length)];
      const t = targets[Math.floor(Math.random() * targets.length)] || "core";
      const box = el();
      if (box) box.insertAdjacentHTML("beforeend", `<div class="ev"><span class="t">${new Date().toTimeString().slice(0, 8)}</span><span class="n">${e}</span><span class="w">${t}</span><span class="d">—</span></div>`);
    }
    return;
  }

  const paint = async () => {
    const box = el();
    if (!box) return stopStreams();
    const rows = await api("/api/logs?limit=16").catch(() => []);
    if (!rows.length) {
      box.innerHTML = '<div class="ev"><span class="n">—</span><span class="w">nada ainda</span><span class="d">use o console</span></div>';
      return;
    }
    box.innerHTML = rows.map((r) => `<div class="ev"><span class="t">${new Date(r.ts).toTimeString().slice(0, 8)}</span><span class="n">${esc(r.source)}</span><span class="w">${esc(r.pluginId || "core")}</span><span class="d">${esc(String(r.message).slice(0, 44))}</span></div>`).join("");
    box.scrollTop = 0;
  };

  await paint();
  evT = setInterval(paint, 3000);
}

/* ─────────── render ─────────── */
function paintHead() {
  $("#brandmark").innerHTML = icon("brand", 13);
  $$(".nav a").forEach((b) => {
    b.classList.toggle("on", b.dataset.go === state.view || (state.view === "plugin" && b.dataset.go === "plugins"));
    const ico = b.querySelector(".ic");
    if (ico && !ico.childElementCount) ico.innerHTML = icon(b.dataset.go, 13);
  });
  $("#nav-pl-count").textContent = plugins.length;
  $("#foot-active").textContent = plugins.filter((p) => p.enabled).length;
}

function render() {
  const v = state.view;
  stopStreams();
  let html;
  if (v === "overview") html = viewOverview();
  else if (v === "plugins") html = viewPlugins();
  else if (v === "plugin") html = viewPlugin(state.plugin);
  else if (v === "install") html = viewInstall();
  else if (v === "console") html = viewConsole();
  else if (v === "guilds") html = viewGuilds();
  else if (v === "protocol") html = viewProtocol();
  else if (v === "guide") html = viewGuide();
  else if (v === "logs") html = viewLogs();
  $("#view").innerHTML = html;
  paintHead();
  if (v === "overview") startEvStream();
  if (v === "logs") { fillLogs(); logT = setInterval(fillLogs, 4000); }
  if (v === "plugin" && state.tab === "logs") fillPluginLogs(state.plugin);
  if (v === "install" && wiz.sources === null && apiOnline) wizLoadSources();
}

/* navegação pinta o esqueleto e depois o conteúdo */
let navToken = 0;
function navigate(next, plugin) {
  const token = ++navToken;
  state.view = next;
  state.plugin = plugin || null;
  state.tab = "overview";
  $("#view").innerHTML = skeletonFor(next);
  paintHead();
  $("#view").scrollTop = 0;
  setTimeout(() => { if (token === navToken) render(); }, 420);
}

let evT = null, logT = null;
const stopStreams = () => { clearInterval(evT); clearInterval(logT); evT = logT = null; };

/* ─────────── eventos ─────────── */
document.addEventListener("click", async (e) => {
  const go = e.target.closest("[data-go]");
  if (go) {
    const next = go.dataset.go;
    if (next === "install" && state.view !== "install" && wiz.step !== 1) {
      wiz = { step: 1, url: "", sources: null, manifest: null, perms: {}, logs: [], timer: null, done: false, error: null, result: null };
    }
    navigate(next);
    if (next === "install" && wiz.sources === null) wizLoadSources();
    return;
  }

  const pl = e.target.closest("[data-plugin]");
  if (pl && !e.target.closest("[data-act]")) {
    navigate("plugin", pl.dataset.plugin);
    return;
  }

  const tab = e.target.closest("[data-tab]");
  if (tab) {
    state.tab = tab.dataset.tab;
    $$(".segmented button").forEach((b) => b.classList.toggle("on", b === tab));
    $("#tab-body").innerHTML = `<div style="margin-bottom:12px">${sk("210px", 10)}</div>${skDetailTab()}`;
    const id = tab.dataset.id, t = state.tab;
    setTimeout(async () => {
      if (state.tab !== t) return;
      const p2 = plugins.find((x) => x.id === id);
      const body = $("#tab-body");
      if (!body || !p2) return;
      body.innerHTML = pluginTab(p2, t);
      if (t === "logs") fillPluginLogs(id);
    }, 320);
    return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  const p = plugins.find((x) => x.id === act.dataset.id);

  if (a === "theme") toggleTheme();
  else if (a === "guide-mode") {
    state.guideMode = act.dataset.mode;
    render();
  } else if (a === "copy") {
    const txt = GUIDE_SNIPPETS[act.dataset.snippet] ?? "";
    try {
      await navigator.clipboard.writeText(txt);
      toast("Copiado");
    } catch {
      // clipboard bloqueado (http ou permissão): seleciona o texto pro usuário copiar
      const pre = act.parentElement?.querySelector("pre");
      if (pre) {
        const r = document.createRange();
        r.selectNodeContents(pre);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        toast("Selecionado — use ⌘C");
      } else toast("Não deu para copiar");
    }
  }
  else if (a === "toggle") {
    if (apiOnline) {
      try {
        await api(`/api/plugins/${p.id}`, { method: "PATCH", body: JSON.stringify({ enabled: act.checked }) });
        await loadData();
        toast(`${p.name} ${act.checked ? "ativado" : "desativado"}`);
      } catch (err) { toast(`Falha: ${err.message}`); }
    } else {
      p.enabled = act.checked;
      p.status = p.enabled ? "healthy" : "stopped";
      toast(`${p.name} ${p.enabled ? "ativado" : "desativado"}`);
    }
    render();
  } else if (a === "kill") {
    if (apiOnline) {
      try {
        await api(`/api/plugins/${p.id}`, { method: "PATCH", body: JSON.stringify({ enabled: false }) });
        await loadData();
        toast(`${p.name} parado.`);
      } catch (err) { toast(`Falha: ${err.message}`); }
    } else {
      p.enabled = false; p.status = "stopped";
      toast(`${p.name} parado.`);
    }
    render();
  } else if (a === "save") {
    const cfg = { ...p.config };
    for (const [k, s] of Object.entries(p.schema)) {
      const el = $(`#cfg-${k}`);
      if (!el) continue;
      if (s.type === "boolean") { cfg[k] = el.checked; continue; }
      if (el.value === "") { delete cfg[k]; continue; } // vazio volta ao padrão
      const n = Number(el.value);
      if (s.type === "number" && !Number.isFinite(n)) { delete cfg[k]; continue; }
      cfg[k] = s.type === "number" ? n : el.value;
    }
    if (apiOnline) {
      try {
        const guildId = p.guilds[0] || curGuild;
        await api(`/api/plugins/${p.id}/config`, { method: "PATCH", body: JSON.stringify({ guildId, config: cfg }) });
        p.config = cfg;
        toast(`Configuração de ${p.name} aplicada`);
      } catch (err) { toast(`Falha: ${err.message}`); }
    } else {
      p.config = cfg;
      toast(`Configuração de ${p.name} aplicada`);
    }
    render();
  } else if (a === "reset") render();
  else if (a === "refresh-logs") {
    if (state.view === "plugin") fillPluginLogs(act.dataset.id || state.plugin);
    else fillLogs();
    toast("Logs atualizados");
  } else if (a === "rpc") {
    const m = act.dataset.m;
    if (!apiOnline) {
      const el = $("#rpc-out");
      if (el) el.textContent = JSON.stringify({ jsonrpc: "2.0", id: 1, error: { code: -32000, message: "modo demonstração: abra pela porta do core" } }, null, 2);
      return;
    }
    const el = $("#rpc-out");
    if (el) el.textContent = "consultando…";
    const res = await api(`/api/plugins/${act.dataset.id}/health`, { method: "POST" }).catch((err) => ({ error: err.message }));
    if (el) el.textContent = JSON.stringify({ jsonrpc: "2.0", id: 1, result: res.result ?? res }, null, 2);
  } else if (a === "run-cmd") {
    const el = $("#rpc-out");
    if (el) el.textContent = `executando !${act.dataset.cmd}…`;
    if (!apiOnline) { if (el) el.textContent = JSON.stringify({ error: "modo demonstração" }, null, 2); return; }
    const res = await api(`/api/plugins/${act.dataset.id}/call`, {
      method: "POST",
      body: JSON.stringify({ method: "handleCommand", guildId: curGuild, params: { command: act.dataset.cmd, args: [], userId: "4410" } }),
    }).catch((err) => ({ error: err.message }));
    if (el) el.textContent = JSON.stringify(res, null, 2);
    refreshQuiet();
  } else if (a === "save-cmds") {
    const list = [];
    $$("[data-cmdrow]").forEach((row) => {
      const name = row.dataset.cmdrow;
      const aliasEl = row.querySelector(".cmd-alias");
      const onEl = row.querySelector("[data-cmdenabled]");
      const entry = { name, enabled: !!onEl?.checked };
      const alias = (aliasEl?.value || "").trim().toLowerCase().replace(/\s+/g, "-");
      if (alias && alias !== name) entry.alias = alias;
      list.push(entry);
    });
    if (!list.some((c) => c.enabled)) return toast("Deixe ao menos um comando ativo");
    if (!apiOnline) return toast("Modo demonstração");
    try {
      const res = await api(`/api/plugins/${p.id}/commands`, { method: "PUT", body: JSON.stringify({ commands: list }) });
      p.commandOverrides = res.commands || list;
      await loadData();
      toast(`Comandos de ${p.name} atualizados`);
    } catch (err) { toast(`Falha: ${err.message}`); }
    render();
  } else if (a === "refresh") {
    if (!apiOnline) return toast("Modo demonstração");
    const btn = act;
    btn.disabled = true;
    btn.textContent = "Puxando…";
    try {
      const res = await api(`/api/plugins/${p.id}/refresh`, { method: "POST", body: "{}" });
      await loadData();
      if (res.updated) {
        const n = (res.commands || []).length;
        toast(`${p.name} atualizado para ${res.commitSha} · ${plural(n, "comando", "comandos")}`);
      } else if (res.reason) {
        toast(res.reason);
      } else {
        toast(`${p.name} já estava no último commit (${res.commitSha})`);
      }
    } catch (err) {
      toast(`Falha ao atualizar: ${err.message}`);
      btn.disabled = false;
      btn.textContent = "Atualizar";
    }
    render();
  } else if (a === "restart-all") {
    if (!apiOnline) return toast("Modo demonstração");
    try {
      await api("/api/restart", { method: "POST", body: "{}" });
      await loadData();
      toast("Todos os plugins reiniciados");
    } catch (err) { toast(`Falha: ${err.message}`); }
    render();
  } else if (a === "wiz-next") wizNext();
  else if (a === "wiz-pick") { wiz.url = act.dataset.dir; $("#wiz-url").value = wiz.url; wizNext(); }
  else if (a === "wiz-back") { wiz.step = Math.max(1, wiz.step - 1); render(); }
  else if (a === "wiz-perms") { wiz.step = 3; render(); }
  else if (a === "wiz-build") wizBuild();
  else if (a === "wiz-done") { wiz.step = 5; render(); }
  else if (a === "wiz-reset") { wiz = { step: 1, url: "", sources: wiz.sources, manifest: null, perms: {}, logs: [], timer: null, done: false, error: null, result: null }; render(); }
  else if (a === "con-send") {
    try { await conSend(); } catch (err) { toast(`JSON inválido: ${err.message}`); }
  }
});

/* primeira pintura: esqueleto, busca os dados reais, depois conteúdo */
async function boot() {
  $("#view").innerHTML = skeletonFor("overview");
  paintHead();
  try {
    await loadData();
  } catch {
    apiOnline = false; // aberto como arquivo, ou core fora do ar: modo demonstração
  }
  render();
}

boot();
setInterval(() => { if (apiOnline && state.view === "overview") refreshQuiet(); }, 10000);
</script>
</body>
</html>
