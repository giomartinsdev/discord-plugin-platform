<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Platform</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f6f6f7;
    --side:#ededef;
    --surface:#ffffff;
    --surface-2:#fafafb;
    --surface-3:#f1f1f3;
    --text:#1c1c1e;
    --text-2:#5f6066;
    --text-3:#8b8c92;
    --line:rgba(0,0,0,.085);
    --line-2:rgba(0,0,0,.15);
    --accent:#0b62d6;
    --accent-soft:#e9f0fd;
    --green:#16713d;
    --green-soft:#e8f4ec;
    --amber:#8a5a06;
    --amber-soft:#fdf4e2;
    --red:#bb362c;
    --red-soft:#fbeeed;
    --r:11px;
    --r-sm:6px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151517;
      --side:#1a1a1c;
      --surface:#1f1f22;
      --surface-2:#252528;
      --surface-3:#2b2b2f;
      --text:#f2f2f4;
      --text-2:#a4a4ab;
      --text-3:#8c8c93;
      --line:rgba(255,255,255,.08);
      --line-2:rgba(255,255,255,.17);
      --accent:#3d8bfd;
      --accent-soft:rgba(61,139,253,.15);
      --green:#37c25f;
      --green-soft:rgba(55,194,95,.13);
      --amber:#e8b53a;
      --amber-soft:rgba(232,181,58,.13);
      --red:#f26157;
      --red-soft:rgba(242,97,87,.13);
    }
  }
  html[data-theme="light"]{
    --bg:#f6f6f7;--side:#ededef;--surface:#fff;--surface-2:#fafafb;--surface-3:#f1f1f3;
    --text:#1c1c1e;--text-2:#5f6066;--text-3:#8b8c92;
    --line:rgba(0,0,0,.085);--line-2:rgba(0,0,0,.15);
    --accent:#0b62d6;--accent-soft:#e9f0fd;
    --green:#16713d;--green-soft:#e8f4ec;--amber:#8a5a06;--amber-soft:#fdf4e2;--red:#bb362c;--red-soft:#fbeeed;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#151517;--side:#1a1a1c;--surface:#1f1f22;--surface-2:#252528;--surface-3:#2b2b2f;
    --text:#f2f2f4;--text-2:#a4a4ab;--text-3:#8c8c93;
    --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.17);
    --accent:#3d8bfd;--accent-soft:rgba(61,139,253,.15);
    --green:#37c25f;--green-soft:rgba(55,194,95,.13);--amber:#e8b53a;--amber-soft:rgba(232,181,58,.13);--red:#f26157;--red-soft:rgba(242,97,87,.13);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:13.5px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.004em;
  }
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
  input,select,textarea{
    font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-2);
    border-radius:var(--r-sm);padding:6px 9px;width:100%;outline:none;letter-spacing:inherit;
    transition:border-color .12s, box-shadow .12s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  ::selection{background:var(--accent-soft)}
  svg{display:block}

  .app{display:grid;grid-template-columns:230px 1fr;height:100%}

  /* ══ barra lateral ══ */
  .rail{
    background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:14px 9px 10px;gap:18px;overflow:auto;
  }
  .brand{display:flex;gap:9px;align-items:center;padding:2px 9px 0}
  .brand .mark{
    width:25px;height:25px;border-radius:7px;flex:0 0 auto;
    background:var(--text);color:var(--side);
    display:grid;place-items:center;
  }
  .brand .txt b{display:block;font-size:13px;font-weight:600;letter-spacing:-.012em;line-height:1.25}
  .brand .txt span{display:block;font-size:11px;color:var(--text-3);line-height:1.3}

  .nav{display:flex;flex-direction:column;gap:1px}
  .nav i{font-style:normal;font-size:11px;font-weight:600;color:var(--text-3);padding:13px 10px 4px;letter-spacing:.005em}
  .nav a{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:5px 9px;border-radius:var(--r-sm);color:var(--text);
    font-size:13px;text-align:left;cursor:pointer;transition:background .1s;
  }
  .nav a:hover{background:var(--line)}
  .nav a.on{background:var(--surface);color:var(--text);font-weight:500}
  .nav a.on .ic{color:var(--accent);opacity:1}
  .nav .ic{opacity:.5;flex:0 0 auto;display:grid;place-items:center;width:15px}
  .nav .count{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .nav a.on .count{color:var(--text-2)}

  .rail .foot{
    margin-top:auto;padding:11px 10px 2px;border-top:1px solid var(--line);
    display:grid;gap:6px;font-size:11.5px;color:var(--text-2);
  }
  .rail .foot .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .rail .foot .row b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex:0 0 auto}

  /* ══ conteúdo ══ */
  main{overflow:auto;background:var(--bg)}
  .wrap{max-width:1064px;margin:0 auto;padding:0 34px 72px}
  @media(max-width:860px){.wrap{padding:0 18px}}

  .topbar{display:flex;align-items:center;gap:10px;padding:13px 0 0}
  .guild{
    display:flex;align-items:center;gap:8px;padding:3px 11px 3px 3px;
    border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);
    font-size:12.5px;font-weight:500;cursor:pointer;
  }
  .guild:hover{border-color:var(--line-2)}
  .guild .av{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#fff;background:#71727a}
  .guild em{font-style:normal;font-weight:400;color:var(--text-3);font-size:11.5px;font-variant-numeric:tabular-nums}
  .topbar .sp{flex:1}
  .iconbtn{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2)}
  .iconbtn:hover{background:var(--surface);color:var(--text)}
  .me{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
  .me .av{width:22px;height:22px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--text-2)}

  /* cabeçalho de página */
  .head{display:flex;align-items:flex-end;gap:24px;padding:30px 0 20px}
  .head .txt{flex:1;min-width:0}
  .eyebrow{font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.01em;margin-bottom:5px}
  h1{font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.024em;margin:0}
  .lede{margin:6px 0 0;font-size:13.5px;color:var(--text-2);max-width:62ch;line-height:1.5}
  @media(max-width:640px){h1{font-size:21px}.head{flex-direction:column;align-items:flex-start;gap:14px;padding:20px 0 15px}}

  /* botões */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:28px;padding:0 11px;border-radius:var(--r-sm);
    background:var(--surface);border:1px solid var(--line-2);
    font-size:12.5px;font-weight:500;color:var(--text);white-space:nowrap;
    transition:background .1s;
  }
  .btn:hover{background:var(--surface-2)}
  .btn.pri{background:var(--accent);border-color:transparent;color:#fff}
  .btn.pri:hover{filter:brightness(1.09)}
  .btn.danger{color:var(--red);border-color:var(--red-soft);background:transparent}
  .btn.danger:hover{background:var(--red-soft);border-color:var(--red-soft)}
  .btn.sm{height:24px;padding:0 9px;font-size:12px}
  .btn:disabled{opacity:.4;pointer-events:none}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* cartões */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .pad{padding:16px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px 11px}
  .card-h h2{font-size:12.5px;font-weight:600;margin:0;letter-spacing:-.01em}
  .card-h .sub{font-size:11.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:5px}
  .card-h .link{font-size:12px;font-weight:500;color:var(--accent);cursor:pointer}
  .card-h .link:hover{text-decoration:underline}

  /* faixa de métricas */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .metric{padding:13px 16px 15px;border-left:1px solid var(--line)}
  .metric:first-child{border-left:0}
  .metric .lbl{font-size:11.5px;color:var(--text-3);line-height:1.35}
  .metric .val{font-size:21px;font-weight:600;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
  .metric .val small{font-size:12px;font-weight:400;color:var(--text-3);letter-spacing:0}
  .metric .delta{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.35}
  @media(max-width:880px){
    .metrics{grid-template-columns:1fr 1fr}
    .metric:nth-child(3){border-left:0}
    .metric:nth-child(n+3){border-top:1px solid var(--line)}
  }

  .cols{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:12px;align-items:start}
  @media(max-width:1000px){.cols{grid-template-columns:1fr}}
  .stack{display:grid;gap:12px}

  .guilds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:880px){.guilds{grid-template-columns:1fr}}

  /* lista de plugins */
  .rows{display:block}
  .row-item{
    display:flex;align-items:center;gap:11px;
    padding:11px 16px;border-top:1px solid var(--line);
    cursor:pointer;transition:background .08s;
  }
  .row-item:first-child{border-top:0}
  .row-item:hover{background:var(--surface-2)}
  .tile{
    width:29px;height:29px;border-radius:var(--r-sm);flex:0 0 auto;
    display:grid;place-items:center;
    background:var(--surface-3);
    font-size:11.5px;font-weight:600;color:var(--text-2);letter-spacing:0;
  }
  .tile.lg{width:42px;height:42px;border-radius:9px;font-size:16px}
  .row-main{flex:1;min-width:0}
  .row-main .name{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;letter-spacing:-.008em}
  .row-main .name .ver{font-weight:400;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .row-main .desc{font-size:12px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-main .meta{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
  .row-end{display:flex;align-items:center;gap:12px;flex:0 0 auto;color:var(--text-3)}
  .row-end .num{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2)}
  .row-end .num span{color:var(--text-3)}
  .chev{color:var(--text-3);opacity:.55}

  /* status */
  .stat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);white-space:nowrap}
  .stat.ok{color:var(--green)} .stat.warn{color:var(--amber)} .stat.err{color:var(--red)}
  .stat .dot{background:currentColor}
  .tag{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:500;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
  .tag.ok{background:var(--green-soft);color:var(--green)}
  .tag.warn{background:var(--amber-soft);color:var(--amber)}
  .tag.err{background:var(--red-soft);color:var(--red)}
  .tag.acc{background:var(--accent-soft);color:var(--accent)}
  .tag.code{font-family:var(--mono);font-size:10.5px;font-weight:400}

  .mono{font-family:var(--mono);font-size:11.5px}
  .dim{color:var(--text-3)}
  .muted{color:var(--text-2)}
  .num{font-variant-numeric:tabular-nums}
  .sep{height:1px;background:var(--line);margin:0}
  .sec{font-size:11.5px;font-weight:600;color:var(--text-3);margin:0 0 8px}

  /* gráfico de volume */
  .chart{padding:2px 16px 14px}
  .chart .bars{display:flex;align-items:flex-end;gap:3px;height:78px}
  .chart .bars i{flex:1;background:var(--accent);opacity:.22;border-radius:2px 2px 0 0;min-height:2px;transition:opacity .12s}
  .chart .bars i:hover{opacity:.65}
  .chart .bars i.hot{opacity:.85}
  .chart .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin-top:7px;font-variant-numeric:tabular-nums}
  .chart .legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-2);margin-top:10px;flex-wrap:wrap}
  .chart .legend b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}

  /* atividade */
  .stream{padding:0 0 8px;max-height:222px;overflow:auto;font-size:11.5px}
  .stream .ev{display:flex;gap:8px;align-items:baseline;padding:3px 16px;font-variant-numeric:tabular-nums}
  .stream .ev .t{color:var(--text-3);font-family:var(--mono);font-size:10.5px;flex:0 0 auto}
  .stream .ev .n{color:var(--text-2);font-family:var(--mono);font-size:11px;flex:0 0 auto;min-width:132px}
  .stream .ev .w{color:var(--text-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stream .ev .d{color:var(--text-3);font-family:var(--mono);font-size:10.5px}

  /* atenção */
  .attn{display:flex;gap:9px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;line-height:1.45;align-items:flex-start}
  .attn:first-child{border-top:0}
  .attn b{font-weight:500}
  .attn .txt{color:var(--text-2)}
  .attn .stat{margin-top:1px;flex:0 0 auto}

  /* tabelas */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;font-weight:500;color:var(--text-3);padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  th.r,td.r{text-align:right}
  .tblwrap{overflow-x:auto}

  /* abas */
  .segmented{display:inline-flex;gap:1px;padding:2px;background:var(--surface-3);border-radius:var(--r-sm);margin:0 0 14px;border:1px solid var(--line)}
  .segmented button{padding:3px 12px;border-radius:4px;font-size:12.5px;color:var(--text-2);transition:.12s;white-space:nowrap}
  .segmented button:hover{color:var(--text)}
  .segmented button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 0 0 1px var(--line)}

  /* guia */
  .guide{max-width:760px}
  .doc{display:grid;gap:12px}
  .doc .doc-h{display:flex;align-items:center;gap:9px}
  .doc .doc-h .n{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .doc h3{font-size:13px;font-weight:600;margin:0;letter-spacing:-.01em}
  .doc p{font-size:12.5px;color:var(--text-2);line-height:1.62;margin:8px 0 0}
  .doc ul,.doc ol{margin:8px 0 0;padding-left:19px;font-size:12.5px;color:var(--text-2);line-height:1.62}
  .doc li{margin:4px 0}
  .doc code{font-family:var(--mono);font-size:11px;background:var(--surface-3);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
  .codewrap{position:relative}
  .codewrap pre{padding-right:74px}
  .codewrap .btn{position:absolute;top:7px;right:7px}
  .callout{border-left:2px solid var(--line-2);padding:1px 0 1px 11px;margin-top:11px;font-size:12px;color:var(--text-3);line-height:1.6}
  .callout b{color:var(--text-2);font-weight:500}
  .callout.amber{border-color:var(--amber)}

  /* código */
  pre{
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
    padding:13px;margin:0;overflow:auto;
    font-family:var(--mono);font-size:11.5px;line-height:1.72;color:var(--text);
  }
  .hint{font-size:11.5px;color:var(--text-3);margin-top:7px;line-height:1.55}

  .dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:12.5px;align-items:baseline}
  .dl dt{color:var(--text-3);white-space:nowrap}
  .dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

  /* switch */
  .switch{position:relative;display:inline-block;width:37px;height:22px;flex:0 0 auto}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch i{position:absolute;inset:0;background:var(--line-2);border-radius:99px;transition:background .18s;cursor:pointer}
  .switch i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .18s}
  .switch input:checked + i{background:var(--green)}
  .switch input:checked + i::after{transform:translateX(15px)}
  .switch input:focus-visible + i{box-shadow:0 0 0 3px var(--accent-soft)}

  /* linhas de ajuste */
  .set-row{display:flex;align-items:center;gap:14px;padding:11px 16px;border-top:1px solid var(--line)}
  .set-row:first-child{border-top:0}
  .set-row .l{flex:1;min-width:0}
  .set-row .l .t{font-size:12.5px;font-weight:500;letter-spacing:-.005em}
  .set-row .l .d{font-size:11.5px;color:var(--text-3);margin-top:1px;line-height:1.4}
  .set-row .ctl{flex:0 0 auto;width:168px}
  .set-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:11px 16px;background:var(--surface-2);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
  @media(max-width:700px){.set-row{flex-wrap:wrap}.set-row .ctl{width:100%}}

  /* logs */
  .logs{background:var(--surface-2);border-top:1px solid var(--line);max-height:400px;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:11.5px;line-height:1.72}
  .logs.round{border-radius:0 0 var(--r) var(--r);border-top:1px solid var(--line)}
  .logs .ln{display:flex;gap:8px;padding:1px 15px}
  .logs .ln .t{color:var(--text-3);flex:0 0 auto}
  .logs .ln .s{color:var(--text-3);flex:0 0 auto;min-width:72px}
  .logs .ln .lv{flex:0 0 auto;width:34px;font-weight:500}
  .logs .lv.info{color:var(--accent)} .logs .lv.ok{color:var(--green)} .logs .lv.warn{color:var(--amber)} .logs .lv.err{color:var(--red)}
  .logs .ln .m{color:var(--text-2);min-width:0;white-space:pre-wrap}

  /* wizard */
  .wiz{max-width:760px}
  .steps{display:flex;align-items:center;gap:0;margin:0 0 16px;font-size:12px;color:var(--text-3);flex-wrap:wrap;row-gap:8px}
  .steps .st{display:flex;align-items:center;gap:7px}
  .steps .st .n{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--surface-3);color:var(--text-2);border:1px solid var(--line)}
  .steps .st.on{color:var(--text);font-weight:500}
  .steps .st.on .n{background:var(--accent);color:#fff;border-color:transparent}
  .steps .st.done .n{background:var(--green-soft);color:var(--green);border-color:transparent}
  .steps .bar{width:22px;height:1px;background:var(--line-2);margin:0 9px}

  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;color:var(--text-2)}
  .check .ok{color:var(--green);flex:0 0 auto}

  .cap-row{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}

/* ─────────── API ─────────── */

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { "content-type": "application/json" },
    ...opts,
  });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

/** Traduz o formato da API para o formato que as telas já desenham. */
function mapPlugin(p) {
  const schema = {};
  for (const [k, s] of Object.entries(p.configSchema || {})) {
    schema[k] = { type: s.type || "string", title: s.title || k, hint: s.description || s.hint || "", default: s.default };
  }
  const install = p.guilds?.find((g) => g.enabled) ?? p.guilds?.[0];
  const defaults = Object.fromEntries(
    Object.entries(schema).filter(([, s]) => s.default !== undefined).map(([k, s]) => [k, s.default]),
  );
  return {
    id: p.id,
    name: p.name,
    lang: p.lang,
    version: p.version,
    desc: p.description || "",
    repo: p.repoUrl ? p.repoUrl.replace(/^https?:\/\//, "").replace(/\.git$/, "") : "—",
    repoRaw: p.repoUrl || null,
    branch: p.branch || "—",
    sha: (p.commitSha || "local"),
    source: p.source || null,
    commandOverrides: p.commandOverrides || [],
    manifest: p.manifest || null,
    runtime: {
      kind: p.runtime?.kind || "process",
      cmd: p.runtime?.cmd || [],
      image: p.runtime?.image || null,
    },
    status: p.status,
    enabled: p.enabled,
    guilds: (p.guilds || []).filter((g) => g.enabled).map((g) => g.guildId),
    caps: p.capabilities || [],
    commands: (p.commands || []).map((c) => ({ name: c.name, desc: c.description || "" })),
    events: p.events || [],
    calls24h: p.stats?.calls24h ?? 0,
    p95: p.stats?.p95 ?? 0,
    errors24h: p.stats?.errors24h ?? 0,
    kvKeys: p.kvKeys ?? 0,
    mem: "—",
    restarts: p.restarts ?? 0,
    alive: p.alive,
    schema,
    config: { ...defaults, ...(install?.config ?? {}) },
  };
}

async function loadData() {
  const [st, list, gs] = await Promise.all([api("/api/status"), api("/api/plugins"), api("/api/guilds")]);
  status = st;
  plugins = list.map(mapPlugin);
  guilds = gs.map((g) => ({
    id: g.id,
    name: g.name,
    initials: g.initials || g.name.slice(0, 2).toUpperCase(),
    members: g.members ?? 0,
    role: g.role || "membro",
  }));
  if (Array.isArray(st.volume) && st.volume.some((v) => v > 0)) {
    const peak = Math.max(...st.volume, 1);
    VOLUME.length = 0;
    VOLUME.push(...st.volume.map((v) => Math.round((v / peak) * 100)));
  }
  if (!guilds.some((g) => g.id === curGuild)) curGuild = guilds[0]?.id ?? curGuild;
  apiOnline = true;
  return { st, list, gs };
}

/** Recarrega só os números, sem trocar a tela. */
async function refreshQuiet() {
  if (!apiOnline) return;
  try {
    const [st, list] = await Promise.all([api("/api/status"), api("/api/plugins")]);
    status = st;
    const mapped = list.map(mapPlugin);
    if (mapped.length !== plugins.length) { plugins = mapped; render(); return; }
    plugins = mapped;
  } catch { /* mantém a última leitura */ }
}

  document.documentElement.dataset.theme = isDark() ? "light" : "dark";

const statusOf = (p) => !p.enabled
  ? { label: "Parado", cls: "", tone: "var(--text-3)" }
  : p.status === "healthy"
    ? { label: "Ativo", cls: "ok", tone: "var(--green)" }
    : p.status === "degraded"
      ? { label: "Degradado", cls: "warn", tone: "var(--amber)" }
      : { label: "Parado", cls: "err", tone: "var(--red)" };

const statusTag = (p) => {
  const s = statusOf(p);
  return `<span class="stat ${s.cls}"><i class="dot" style="background:${s.tone}"></i>${s.label}</span>`;
};

const runtimeLabel = (p) => p.runtime.kind === "container" ? "container" : p.runtime.kind === "core" ? "core" : "processo";
const runtimeTag = (p) => `<span class="tag ${p.runtime.kind === "core" ? "acc" : "code"}">${runtimeLabel(p)}</span>`;

const langLabel = (p) => `<span style="display:inline-flex;align-items:center;gap:5px;color:var(--text-3)">
  <span style="width:5px;height:5px;border-radius:50%;background:${LANG_COLOR[p.lang] || "#8b8c92"}"></span>${LANG[p.lang] || p.lang}</span>`;

const capChips = (caps, max) => {
  const list = max ? caps.slice(0, max) : caps;
  const rest = max ? caps.length - list.length : 0;
  return `<div class="chips">${list.map((c) => `<span class="tag" title="${esc(c)}">${esc((CAPS[c] || [c])[0])}</span>`).join("")}${rest > 0 ? `<span class="tag code">+${rest}</span>` : ""}</div>`;
};

function skeletonFor(v) {
  if (v === "overview") return shell(skHead(), skMetrics() + `<div class="cols"><div class="stack">${skChart()}${skList()}</div><div class="stack"><section class="card">${skCardH()}${skStream()}</section><section class="card">${skCardH(148)}${skStream(3)}</section></div></div>`);
  if (v === "plugins") return shell(skHead(), skTable());
  if (v === "plugin") return shell(skDetailHead(), skDetailTab());
  if (v === "install") return shell(skHead(), `<div class="wiz">${skSteps()}${skForm(2)}</div>`);
  if (v === "console") return shell(skHead(), `<div class="cols">${skCodeCard(11, 82)}${skCodeCard(11, 68)}</div>`);
  if (v === "guilds") return shell(skHead(), `<div class="guilds">${[0, 1, 2].map(skGuildCard).join("")}</div>
    <section class="card pad" style="margin-top:12px">${sk("150px", 9)}
      <div class="bars-list" style="margin-top:12px">${[0, 1, 2, 3, 4].map(() => `<div class="b">${sk("126px", 10)}${sk("100%", 4, 99)}</div>`).join("")}</div>
    </section>`);
  if (v === "protocol") return shell(skHead(), `<div class="cols"><div class="stack">${skTable(5)}${skCodeCard(9, 176)}</div><div class="stack">${skCodeCard(13, 132)}${skTable(3)}</div></div>`);
  if (v === "guide") return shell(skHead(), `<div class="cols"><div class="stack">${skCodeCard(13, 220)}${skTable(4)}</div><div class="stack">${skCodeCard(9, 160)}${skCodeCard(7, 120)}</div></div>`);
  if (v === "logs") return shell(skHead(), `<section class="card">${skCardH(128)}${skLogs()}</section>`);
  return shell(skHead(), skMetrics() + `<div class="cols"><div class="stack">${skList()}</div><div class="stack">${skCodeCard(6)}</div></div>`);
}

function shell(head, body) {
  return `<div class="topbar">${guildPicker()}<div class="sp"></div>
      <button class="iconbtn" data-act="theme" title="Alternar aparência">${icon(isDark() ? "sun" : "moon", 15)}</button>
      <div class="me"><div class="av">GM</div>giovanni</div>
    </div>
    <div class="fade">${head}${body}</div>`;
}

function guildPicker() {
  const g = guilds.find((x) => x.id === curGuild) || guilds[0];
  return `<div class="guild" title="Trocar de servidor"><div class="av">${g.initials}</div>${esc(g.name)}<em>${nf(g.members)}</em></div>`;
}

function pageHead(title, lede, actions, eyebrow) {
  return `<div class="head"><div class="txt">
      ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}
      <h1>${esc(title)}</h1>
      ${lede ? `<p class="lede">${lede}</p>` : ""}
    </div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;

/* ─────────── visão geral ─────────── */
function viewOverview() {
  const active = plugins.filter((p) => p.enabled);
  const calls = apiOnline ? status.calls24h : plugins.reduce((a, p) => a + p.calls24h, 0);
  const errs = apiOnline ? status.errors24h : plugins.reduce((a, p) => a + p.errors24h, 0);
  const kv = apiOnline ? status.kvKeys : plugins.reduce((a, p) => a + p.kvKeys, 0);
  const p95s = plugins.filter((p) => p.p95).map((p) => p.p95).sort((a, b) => a - b);
  const p95 = p95s.length ? p95s[Math.min(p95s.length - 1, Math.floor(p95s.length * 0.95))] : 0;
  const off = plugins.length - active.length;
  const errPlugins = plugins.filter((p) => p.errors24h > 0);

  const head = pageHead(
    "Visão geral",
    "Tudo que está rodando neste servidor agora.",
    `<button class="btn" data-act="restart-all">Reiniciar tudo</button><button class="btn pri" data-go="install">Instalar plugin</button>`,
  );

  const metrics = `<div class="metrics">
    <div class="metric"><div class="lbl">Plugins em execução</div><div class="val">${active.length}<small> de ${plugins.length}</small></div><div class="delta">${off ? `${plural(off, "desativado", "desativados")} manualmente` : "todos ativos"}</div></div>
    <div class="metric"><div class="lbl">Chamadas em 24 h</div><div class="val">${nf(calls)}</div><div class="delta">${p95 ? `Tempo de resposta p95 de ${p95} ms` : "Sem chamadas registradas"}</div></div>
    <div class="metric"><div class="lbl">Erros em 24 h</div><div class="val" style="color:${errs ? "var(--amber)" : "var(--green)"}">${nf(errs)}</div><div class="delta">${errPlugins.length ? `Vindos de ${errPlugins.map((p) => p.name).join(", ")}` : "Nenhum erro registrado"}</div></div>
    <div class="metric"><div class="lbl">Chaves armazenadas</div><div class="val">${nf(kv)}</div><div class="delta">Em ${plural(active.length, "espaço de dados", "espaços de dados")}</div></div>
  </div>`;

  const peak = Math.max(...VOLUME, 1);
  const total = VOLUME.reduce((a, b) => a + b, 0) || 1;
  const chart = `<section class="card">
    <div class="card-h"><h2>Volume nas últimas 24 horas</h2><span class="sub">${nf(calls)} chamadas</span></div>
    <div class="chart">
      <div class="bars">${VOLUME.map((v, i) => `<i class="${v >= peak * 0.92 ? "hot" : ""}" style="height:${Math.max(2, (v / peak) * 100)}%" title="${i}h · ${nf(Math.round((v / total) * calls))} chamadas"></i>`).join("")}</div>
      <div class="axis">${HOURLY.map((h) => `<span>${h}h</span>`).join("")}</div>
      <div class="legend">
        ${plugins.slice(0, 3).map((p) => `<span><b>${nf(p.calls24h)}</b> ${esc(p.name)}</span>`).join("")}
      </div>
    </div>
  </section>`;

  const list = `<section class="card">
    <div class="card-h"><h2>Plugins instalados</h2><span class="link" data-go="plugins">Ver todos</span></div>
    <div class="rows">${plugins.map(pluginRow).join("") || '<div class="empty">Nenhum plugin instalado. Use “Instalar plugin”.</div>'}</div>
  </section>`;

  const attention = plugins.filter((p) => !p.enabled || p.status === "degraded" || p.errors24h > 0 || p.restarts > 0);
  const attnRows = attention.slice(0, 4).map((p) => {
    const s = statusOf(p);
    const txt = !p.enabled
      ? `<b>${esc(p.name)}</b> está desativado e não responde a comandos.`
      : p.status === "degraded"
        ? `<b>${esc(p.name)}</b> reiniciou ${p.restarts} ${p.restarts === 1 ? "vez" : "vezes"} e parou de responder.`
        : p.errors24h > 0
          ? `<b>${esc(p.name)}</b> teve ${plural(p.errors24h, "erro", "erros")} nas últimas 24 h.`
          : `<b>${esc(p.name)}</b> reiniciou ${p.restarts} ${p.restarts === 1 ? "vez" : "vezes"}.`;
    return `<div class="attn"><span class="stat ${s.cls}"><i class="dot" style="background:${s.tone}"></i>${s.label}</span><div class="txt">${txt}</div></div>`;
  }).join("");

  const side = `<div class="stack">
    <section class="card">
      <div class="card-h"><h2>Atividade</h2><span class="sub"><i class="dot"></i>${apiOnline ? "Ao vivo" : "Demonstração"}</span></div>
      <div class="stream" id="ev-stream"></div>
    </section>
    <section class="card">
      <div class="card-h"><h2>Precisa de atenção</h2></div>
      ${attnRows || '<div class="attn"><span class="stat ok"><i class="dot"></i>Ativo</span><div class="txt">Nada pendente. Todos os plugins estão saudáveis.</div></div>'}
    </section>
  </div>`;

  return shell(head, metrics + `<div class="cols"><div class="stack">${chart}${list}</div>${side}</div>`);
}

function pluginRow(p) {
  const mem = p.mem && p.mem !== "—" ? ` · ${p.mem}` : "";
  return `<div class="row-item" data-plugin="${p.id}" role="button" tabindex="0">
    <div class="tile">${esc(p.name.charAt(0))}</div>
    <div class="row-main">
      <div class="name">${esc(p.name)}<span class="ver">${p.version}</span>${p.status === "degraded" ? statusTag(p) : ""}</div>
      <div class="desc">${esc(p.desc)}</div>
      <div class="meta">${langLabel(p)} <span class="dim">·</span> ${runtimeLabel(p)} ${!p.enabled ? `<span class="dim">·</span> desativado` : ""}</div>
    </div>
    <div class="row-end"><span class="num">${nf(p.calls24h)}<span> chamadas${mem}</span></span><span class="chev">${icon("chevR", 13)}</span></div>
  </div>`;
}

      <thead><tr><th>Plugin</th><th>Ambiente</th><th>Status</th><th>Permissões</th><th class="r">Chamadas</th><th class="r">p95</th><th class="r">Erros</th><th></th></tr></thead>
      <tbody>
      ${plugins.map((p) => `

            <div style="display:flex;align-items:center;gap:9px">
              <div class="tile" style="width:27px;height:27px;border-radius:5px;font-size:11px">${esc(p.name.charAt(0))}</div>
              <div>
                <div style="font-weight:500">${esc(p.name)}<span class="dim" style="font-weight:400;font-size:11.5px;margin-left:6px">${p.version}</span></div>

          </td>
          <td>${runtimeTag(p)}</td>
          <td>${statusTag(p)}</td>
          <td>${capChips(p.caps, 2)}</td>
          <td class="r num mono" style="color:var(--text-2)">${nf(p.calls24h)}</td>
          <td class="r num" style="color:${p.p95 > 500 ? "var(--amber)" : "var(--text-2)"};font-variant-numeric:tabular-nums">${p.p95 ? p.p95 + " ms" : "—"}</td>
          <td class="r num" style="color:${p.errors24h ? "var(--red)" : "var(--text-3)"};font-variant-numeric:tabular-nums">${p.errors24h}</td>

/* ─────────── detalhe ─────────── */

  if (!p) return viewPlugins();

  const head = `<div class="back" data-go="plugins">${icon("chevL", 12)}Plugins</div>
    <div class="head" style="padding-top:0">
      <div class="tile lg">${esc(p.name.charAt(0))}</div>
      <div class="txt">
        <h1 style="font-size:21px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">${esc(p.name)}
          <span class="dim" style="font-weight:400;font-size:13px">${p.version}</span>
          ${p.status === "degraded" ? statusTag(p) : ""}
        </h1>
        <div style="font-size:12px;color:var(--text-3);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">
          ${langLabel(p)} <span class="dim">·</span> ${runtimeLabel(p)} <span class="dim">·</span>
          ${p.repo === "—" ? "embutido no core" : `<span class="mono" style="font-size:11px">${esc(p.repo)}</span> <span class="dim">·</span> ${esc(p.branch)} <span class="dim">·</span> <span class="mono" style="font-size:11px">${esc(p.sha)}</span>`}
        </div>
      </div>
      <div class="actions">
        ${p.source?.url ? `<button class="btn" data-act="refresh" data-id="${p.id}" title="git pull + reload em runtime">Atualizar</button>` : ""}
        <label class="switch" title="Ativar ou desativar"><input type="checkbox" data-act="toggle" data-id="${p.id}" ${p.enabled ? "checked" : ""} aria-label="Ativar plugin"><i></i></label>

function pluginTab(p, tab) {
  if (tab === "commands") {
    // a lista vem do manifesto cru: comando desligado some dos efetivos, mas
    // precisa continuar na tela para poder ser religado
    const all = (p.manifest?.commands ?? p.commands ?? []).map((c) => ({ name: c.name, description: c.description ?? "" }));
    const ov = new Map((p.commandOverrides || []).map((o) => [o.name, o]));
    const rows = all.map((c) => {
      const o = ov.get(c.name) ?? {};
      const enabled = o.enabled !== false;
      const alias = o.alias ?? "";
      return `<div class="set-row" data-cmdrow="${esc(c.name)}">
        <div class="l"><div class="t mono" style="font-size:12px;font-weight:500">/${esc(alias || c.name)}${alias ? ` <span class="dim" style="font-weight:400;font-size:10.5px">era /${esc(c.name)}</span>` : ""}</div>
        <div class="d">${esc(c.description)}</div></div>
        <div class="ctl" style="gap:8px">
          <input class="cmd-alias" data-orig="${esc(c.name)}" placeholder="${esc(c.name)}" value="${esc(alias)}" style="width:110px" aria-label="Apelido para ${esc(c.name)}">
          <label class="switch" title="Ativar ou desativar este comando"><input type="checkbox" data-cmdenabled="${esc(c.name)}" ${enabled ? "checked" : ""} aria-label="Ativar /${esc(c.name)}"><i></i></label>
        </div>
      </div>`;
    }).join("");

    return `<div class="cols">
      <section class="card">
        <div class="card-h"><h2>Comandos</h2><span class="sub">${plural(all.length, "comando", "comandos")}</span></div>
        ${rows || '<div class="empty">Este plugin não declara comandos.</div>'}
        <div class="set-foot">
          <span class="dim" style="font-size:11.5px;margin-right:auto">Desligue ou dê apelido sem editar o repositório. O plugin continua vendo o nome original.</span>
          <button class="btn pri" data-act="save-cmds" data-id="${p.id}">Salvar comandos</button>
        </div>
      </section>
      <div class="stack">
        <section class="card pad">
          <h2 class="sec">Origem</h2>
          <dl class="dl">
            <dt>Repositório</dt><dd class="mono" style="font-size:11px;word-break:break-all">${esc(p.repoRaw || "diretório local")}</dd>
            <dt>Branch</dt><dd>${esc(p.branch)}</dd>
            <dt>Commit</dt><dd class="mono" style="font-size:11px">${esc(p.sha)}</dd>
          </dl>
          ${p.source?.url
            ? `<div style="padding:0 16px 14px"><button class="btn sm" data-act="refresh" data-id="${p.id}">Puxar commits novos</button><p class="hint" style="margin-top:8px">Faz <span class="mono">git fetch</span>, reinstala e reinicia só este plugin. Guilds, permissões e configuração ficam.</p></div>`
            : `<p class="hint" style="padding:0 16px 14px">Instalado de um diretório: para atualizar, reinstale apontando o diretório.</p>`}
        </section>
      </div>
    </div>`;
  }

  if (tab === "config") {
    const rows = Object.entries(p.schema).map(([k, s]) => {
      const v = p.config[k];
      const ctl = s.type === "boolean"
        ? `<label class="switch"><input type="checkbox" id="cfg-${k}" ${v ? "checked" : ""}><i></i></label>`
        : `<input id="cfg-${k}" type="${s.type === "number" ? "number" : "text"}" value="${esc(v ?? "")}" aria-label="${esc(s.title)}">`;
      return `<div class="set-row">
        <label class="l" for="cfg-${k}"><div class="t">${esc(s.title)}</div><div class="d">${esc(s.hint || "")}</div></label>
        <div class="ctl">${ctl}</div>
      </div>`;
    }).join("");

    return `<div class="cols">
      <section class="card">
        <div class="card-h"><h2>Configuração</h2><span class="sub">gerada pelo próprio plugin</span></div>
        ${rows || '<div class="empty">Este plugin não declara configuração.</div>'}
        <div class="set-foot">
          <span class="dim" style="font-size:11.5px;margin-right:auto">O core reenvia a configuração sem reiniciar o processo.</span>
          <button class="btn" data-act="reset">Reverter</button>
          <button class="btn pri" data-act="save" data-id="${p.id}">Salvar</button>
        </div>
      </section>
      <div class="stack">
        <section class="card pad">
          <h2 class="sec">Valores em uso</h2>
          <pre>${esc(JSON.stringify(p.config, null, 2))}</pre>
        </section>
        <section class="card pad">
          <h2 class="sec">Como é aplicado</h2>
          <dl class="dl">
            <dt>Por guild</dt><dd>sobrepõe os padrões</dd>
            <dt>Segredos</dt><dd>via ambiente</dd>
            <dt>Recarga</dt><dd>sem reiniciar</dd>
          </dl>
        </section>
      </div>
    </div>`;
  }

  if (tab === "logs") {
    return `<section class="card">
      <div class="card-h"><h2>Logs de ${esc(p.name)}</h2><div style="display:flex;gap:10px;align-items:center"><span class="sub"><i class="dot"></i>${apiOnline ? "Ao vivo" : "Demonstração"}</span><button class="btn sm" data-act="refresh-logs" data-id="${p.id}">Atualizar</button></div></div>
      <div class="logs round" id="plog">${apiOnline ? "" : logLines(p)}</div>
    </section>
    <p class="hint">O plugin escreve em <span class="mono">stderr</span>. O core acrescenta guild e <span class="mono">request_id</span> em cada linha.</p>`;
  }

  if (tab === "protocol") {
    return `<div class="cols">
      <section class="card pad">
        <h2 class="sec">Manifesto do plugin</h2>
        <pre>${esc(manifestOf(p))}</pre>
      </section>
      <div class="stack">
        <section class="card">
          <div class="card-h"><h2>Testar chamada</h2><span class="sub">${apiOnline ? "executa de verdade" : "resposta simulada"}</span></div>
          <div class="pad" style="padding-top:0;display:flex;gap:7px;flex-wrap:wrap">
            <button class="btn sm" data-act="rpc" data-m="health" data-id="${p.id}">health</button>
            ${p.commands.slice(0, 3).map((c) => `<button class="btn sm" data-act="run-cmd" data-cmd="${esc(c.name)}" data-id="${p.id}">!${esc(c.name)}</button>`).join("")}
          </div>
          <div class="pad" style="padding-top:0"><pre id="rpc-out" style="min-height:140px">${esc(JSON.stringify({ jsonrpc: "2.0", note: "escolha um método acima" }, null, 2))}</pre></div>
        </section>
        <p class="hint">${apiOnline
          ? 'A chamada vai pelo mesmo caminho do Discord: processo do plugin, protocolo JSON-RPC, validação de ações.'
          : 'Substitua pelo <span class="mono">POST /api/plugins/&lt;id&gt;/call</span> quando o painel for servido pelo core.'}</p>
      </div>
    </div>`;
  }

  return `<div class="metrics">
      <div class="metric"><div class="lbl">Chamadas em 24 h</div><div class="val" style="font-size:19px">${nf(p.calls24h)}</div></div>
      <div class="metric"><div class="lbl">Tempo de resposta p95</div><div class="val" style="font-size:19px;color:${p.p95 > 500 ? "var(--amber)" : "inherit"}">${p.p95 ? p.p95 + `<small> ms</small>` : "—"}</div></div>
      <div class="metric"><div class="lbl">Erros em 24 h</div><div class="val" style="font-size:19px;color:${p.errors24h ? "var(--red)" : "var(--green)"}">${p.errors24h}</div></div>
      <div class="metric"><div class="lbl">Chaves de dados</div><div class="val" style="font-size:19px">${nf(p.kvKeys)}</div></div>
    </div>
    <div class="cols" style="margin-top:12px">
      <div class="stack">
        <section class="card">
          <div class="card-h"><h2>Comandos</h2><span class="sub">${plural(p.commands.length, "comando", "comandos")}</span></div>
          ${p.commands.map((c) => `<div class="set-row"><div class="l"><div class="t mono" style="font-size:12px;font-weight:500">/${esc(c.name)}</div><div class="d">${esc(c.desc)}</div></div></div>`).join("")}
        </section>
        <section class="card">
          <div class="card-h"><h2>Permissões aprovadas</h2></div>
          <div class="pad" style="padding-top:0">
            ${p.caps.map((c) => {
              const [label, desc] = CAPS[c] || [c, ""];
              return `<div style="display:flex;align-items:baseline;gap:9px;padding:4px 0;font-size:12.5px">
                <span style="font-weight:500;min-width:122px">${esc(label)}</span>
                <span class="mono dim" style="font-size:10.5px;min-width:96px">${esc(c)}</span>
                <span class="dim" style="font-size:11.5px;flex:1">${esc(desc)}</span>
              </div>`;
            }).join("")}
          </div>
        </section>
        <section class="card">
          <div class="card-h"><h2>Eventos assinados</h2></div>
          <div class="pad" style="padding-top:0"><div class="chips">${p.events.length ? p.events.map((e) => `<span class="tag code">${esc(e)}</span>`).join("") : '<span class="dim" style="font-size:12px">Nenhum. O plugin só responde a comandos.</span>'}</div></div>
        </section>
      </div>
      <div class="stack">
        <section class="card pad">
          <h2 class="sec">Ambiente</h2>
          <dl class="dl">
            <dt>Tipo</dt><dd>${runtimeLabel(p)}</dd>
            ${p.runtime.cmd && p.runtime.cmd.length ? `<dt>Comando</dt><dd class="mono" style="font-size:11px">${esc(p.runtime.cmd.join(" "))}</dd>` : ""}
            ${p.runtime.build ? `<dt>Build</dt><dd class="mono" style="font-size:11px">${esc(p.runtime.build.join(" "))}</dd>` : ""}
            ${p.runtime.image ? `<dt>Imagem</dt><dd class="mono" style="font-size:11px">${esc(p.runtime.image)}</dd>` : ""}
            <dt>Reinícios</dt><dd>${p.restarts}</dd>
          </dl>
        </section>
        <section class="card">
          <div class="card-h"><h2>Instalado em</h2></div>
          ${guilds.map((g) => {
            const on = p.guilds.includes("*") || p.guilds.includes(g.id);
            return `<div class="set-row" style="padding:9px 16px"><div class="l"><div class="t" style="font-size:12.5px;font-weight:400">${esc(g.name)}</div></div>${on ? '<span class="stat ok"><i class="dot"></i>Instalado</span>' : '<span class="stat"><i class="dot" style="background:var(--text-3)"></i>Fora</span>'}</div>`;
          }).join("")}
        </section>
      </div>
    </div>`;
}

function manifestOf(p) {
  const caps = p.caps ?? p.capabilities ?? [];
  const events = p.events ?? [];
  const cmds = p.commands ?? [];
  return `name = "${p.id}"
version = "${p.version}"
capabilities = [${caps.map((c) => `"${c}"`).join(", ")}]
events = [${events.map((e) => `"${e}"`).join(", ")}]
commands = [
${cmds.map((c) => `  { name = "${c.name}", description = "${c.desc ?? c.description ?? ""}" },`).join("\n")}
]

[runtime]
kind = "${p.runtime.kind}"${p.runtime.cmd && p.runtime.cmd.length ? `\ncmd  = ${JSON.stringify(p.runtime.cmd)}` : ""}${p.runtime.build ? `\nbuild = ${JSON.stringify(p.runtime.build)}` : ""}${p.runtime.image ? `\nimage = "${p.runtime.image}"\nport  = ${p.runtime.port}` : ""}`;
}

function logLines(p) {
  const base = [
    ["info", "initialize · guild 1201 · configuração aplicada"],
    ["ok", "handleCommand /" + (p.commands[0]?.name || "ping") + " · 41 ms · 1 ação"],
    ["info", "handleEvent MESSAGE_CREATE · 12 ms · 0 ações"],
    ["ok", "kv.set pet:4410 · 3 ms"],
  ];
  if (p.status === "degraded") base.push(["err", "tempo esgotado após 3000 ms · request_id 8f2a1c · processo encerrado"], ["warn", "reinício 7 de 3 · aguardando 8 s"], ["info", "processo saiu com código 137 · SIGKILL"]);
  if (!p.enabled) base.push(["warn", "processo parado pelo administrador"]);
  return base.map(([lvl, msg], i) => {
    const t = `12:0${i}:${String((i * 17) % 60).padStart(2, "0")}`;
    return `<div class="ln"><span class="t">${t}</span><span class="s">[1201]</span><span class="lv ${lvl}">${lvl.toUpperCase()}</span><span class="m">${esc(msg)}</span></div>`;
  }).join("");
}

/* ─────────── instalar ─────────── */
let wiz = { step: 1, url: "", sources: null, manifest: null, perms: {}, logs: [], timer: null, done: false, error: null, result: null };

  const bar = `<div class="steps">${steps.map((s, i) => {
    const n = i + 1;
    const cls = wiz.step === n ? "on" : wiz.step > n ? "done" : "";
    return `${i ? '<span class="bar"></span>' : ""}<span class="st ${cls}"><span class="n">${wiz.step > n ? "✓" : n}</span>${s}</span>`;
  }).join("")}</div>`;

  let body = "";
  if (wiz.step === 1) {
    const list = wiz.sources;
    body = `<section class="card pad">
      <h2 class="sec">Repositório ou diretório</h2>
      <div style="display:flex;gap:8px">
        <input id="wiz-url" placeholder="https://github.com/usuario/meu-plugin ou /caminho/para/o/plugin" value="${esc(wiz.url)}" aria-label="Repositório ou diretório do plugin">
        <button class="btn pri" data-act="wiz-next">Analisar</button>
      </div>
      <p class="hint">Cole o link do repositório git: o core clona, lê o <span class="mono">plugin.toml</span>, copia para <span class="mono">.plugins/</span> e fixa o commit. Depois, o botão <span class="mono">Atualizar</span> no plugin puxa commits novos sem reiniciar o bot.</p>
      ${wiz.error ? `<div class="warnline" style="margin-top:10px">${esc(wiz.error)}</div>` : ""}
    </section>
    ${list === null ? `<section class="card pad" style="margin-top:12px">${sk("140px", 9)}<div class="sk-lines" style="margin-top:12px">${sk("100%", 9)}${sk("88%", 9)}${sk("72%", 9)}</div></section>`
      : `<section class="card" style="margin-top:12px">
        <div class="card-h"><h2>Encontrados neste repositório</h2><span class="sub">${list.length} pasta(s) de plugin</span></div>
        ${list.map((s) => `<div class="set-row" style="padding:9px 16px">
          <div class="l"><div class="t">${esc(s.name)} <span class="dim" style="font-weight:400;font-size:11.5px">${s.version}</span></div>
          <div class="d mono" style="font-size:10.5px">${esc(s.dir)}</div></div>
          <div class="ctl">${s.installed
            ? '<span class="stat ok"><i class="dot"></i>Instalado</span>'
            : `<button class="btn sm" data-act="wiz-pick" data-dir="${esc(s.dir)}">Escolher</button>`}</div>
        </div>`).join("") || '<div class="empty">Nenhuma pasta com plugin.toml.</div>'}
      </section>`}`;
  } else if (wiz.step === 2) {
    const m = wiz.manifest;
    body = `<div class="cols"><section class="card pad">
        <h2 class="sec">Manifesto encontrado</h2>
        <pre>${esc(manifestOf(m))}</pre>
      </section>
      <section class="card">
        <div class="card-h"><h2>Verificações</h2></div>
        <div class="pad" style="padding-top:0;padding-bottom:6px">
          ${[
            ["plugin.toml válido", true],
            [`Ambiente suportado: ${m.runtime.kind}`, true],
            [`Entrada: ${(m.runtime.cmd || []).join(" ") || m.runtime.image || "—"}`, true],
            ["Sem acesso ao token do Discord", true],
            [m.alreadyInstalled ? "Já instalado — será atualizado" : "Ainda não instalado", true],
          ].map(([l]) => `<div class="check"><span class="ok">${icon("check", 13)}</span>${esc(l)}</div>`).join("")}
        </div>
        <div class="sep"></div>
        <div class="pad"><dl class="dl">
          <dt>Linguagem</dt><dd>${esc(LANG[m.lang] || m.lang)}</dd>
          <dt>Commit</dt><dd class="mono" style="font-size:11px">${esc(m.commitSha || "sem git")}</dd>
          <dt>Diretório</dt><dd class="mono" style="font-size:11px">${esc(m.dir)}</dd>
        </dl></div>
        <div class="set-foot"><button class="btn" data-act="wiz-back">Voltar</button><button class="btn pri" data-act="wiz-perms">Revisar permissões</button></div>
      </section></div>`;
  } else if (wiz.step === 3) {
    body = `<div class="cols"><section class="card">
        <div class="card-h"><h2>Permissões pedidas</h2><span class="sub">desmarque para negar</span></div>
        ${wiz.manifest.capabilities.map((c) => {
          const [label, desc] = CAPS[c] || [c, ""];
          const sens = c.startsWith("economy") || c === "kick" || c === "http";
          return `<label class="cap-row">
            <input type="checkbox" data-perm="${c}" ${wiz.perms[c] !== false ? "checked" : ""}>
            <div><div class="nm">${esc(label)}<span class="cd">${esc(c)}</span></div><div class="ds">${esc(desc)}</div>${sens ? '<div class="warnline">Permissão sensível: precisa da sua aprovação explícita.</div>' : ""}</div>
          </label>`;
        }).join("") || '<div class="empty">Este plugin não pede nenhuma permissão.</div>'}
        <div class="set-foot"><button class="btn" data-act="wiz-back">Voltar</button><button class="btn pri" data-act="wiz-build">Instalar</button></div>
      </section>
      <section class="card">
        <div class="card-h"><h2>Instalar em</h2></div>
        ${guilds.map((g, i) => `<label class="set-row" style="cursor:pointer"><input type="checkbox" data-guild="${g.id}" ${i === 0 ? "checked" : ""} style="width:auto;flex:0 0 auto;accent-color:var(--accent)"><div class="l" style="margin-left:9px"><div class="t">${esc(g.name)}</div><div class="d">${esc(g.role)} · ${nf(g.members)} membros</div></div></label>`).join("")}

    </section>`;
  } else {
    const r = wiz.result || {};
    body = `<section class="card pad" style="text-align:center;padding:38px 24px">
      <div style="width:38px;height:38px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 12px">${icon("check", 19)}</div>

      <p class="muted" style="margin:0 0 18px;font-size:12.5px;line-height:1.5">Rodando com ${plural((r.capabilities || []).length, "permissão aprovada", "permissões aprovadas")}, no commit <span class="mono" style="font-size:11px">${esc(r.commitSha || "local")}</span>.</p>
      <div style="display:flex;gap:8px;justify-content:center"><button class="btn" data-act="wiz-reset">Instalar outro</button><button class="btn pri" data-plugin="${esc(r.id || "")}">Abrir plugin</button></div>
    </section>`;
  }

  const head = pageHead("Instalar plugin", "Do diretório ao servidor em quatro passos.", "", "Desenvolvimento");
  return shell(head, `<div class="wiz">${bar}${body}</div>`);
}

async function wizLoadSources() {
  if (!apiOnline) { wiz.sources = []; return render(); }
  try {
    wiz.sources = await api("/api/sources");
  } catch {
    wiz.sources = [];
  }
  if (state.view === "install") render();
}

async function wizNext() {
  wiz.url = $("#wiz-url")?.value || wiz.url;
  const value = wiz.url.trim();
  if (!value) { wiz.error = "Informe o repositório ou o diretório do plugin."; return render(); }
  try {
    const payload = /^(https?:\/\/|git@|ssh:\/\/|git:\/\/|file:\/\/)/.test(value) ? { url: value } : { dir: value };
    wiz.manifest = await api("/api/inspect", { method: "POST", body: JSON.stringify(payload) });
    wiz.error = null;
    wiz.step = 2;
  } catch (err) {
    wiz.error = err.message;
  }
  render();
}

function wizLog(line) {
  wiz.logs.push(line);
  const el = $("#buildlog");
  if (el) {
    el.insertAdjacentHTML("beforeend", `<div class="ln"><span class="m">${esc(line)}</span></div>`);
    el.scrollTop = el.scrollHeight;
  }
}

async function wizBuild() {
  $$("[data-perm]").forEach((c) => (wiz.perms[c.dataset.perm] = c.checked));
  const caps = wiz.manifest.capabilities.filter((c) => wiz.perms[c] !== false);
  const targets = $$("[data-guild]").filter((c) => c.checked).map((c) => c.dataset.guild);
  if (!targets.length) { toast("Escolha ao menos um servidor"); return; }

  wiz.step = 4; wiz.done = false; wiz.logs = []; wiz.error = null;
  render();

  wizLog(`$ analisando ${wiz.manifest.fromRepo ? wiz.manifest.repoUrl : wiz.manifest.dir}`);
  wizLog(`  ${wiz.manifest.id}@${wiz.manifest.version} · ${LANG[wiz.manifest.lang] || wiz.manifest.lang}`);
  wizLog(`  permissões aprovadas: ${caps.join(", ") || "nenhuma"}`);
  wizLog(`$ instalando em ${targets.length} servidor(es)`);

  try {
    const res = await api("/api/plugins", {
      method: "POST",
      body: JSON.stringify({
        url: wiz.manifest.fromRepo ? wiz.manifest.repoUrl : undefined,
        dir: wiz.manifest.fromRepo ? undefined : wiz.manifest.dir,
        guilds: targets, caps, config: {},
      }),
    });
    wiz.result = res;
    wizLog(`  copiado para .plugins/${res.id}`);
    wizLog(`  registrado no banco · versão ${res.version}`);
    wizLog("$ testando protocolo");
    const conf = await api("/api/conformance", { method: "POST", body: JSON.stringify({ dir: wiz.manifest.dir }) }).catch(() => null);
    if (conf?.results) {
      for (const r of conf.results) wizLog(`  ${r.ok ? "✓" : "✗"} ${r.name}${r.detail ? "  " + r.detail : ""}`);
    }
    wizLog("");
    wizLog(`pronto · ${wiz.manifest.id} v${res.version} ativo em ${targets.join(", ")}`);
    await loadData();
    wiz.done = true;
    render();
  } catch (err) {
    wizLog(`erro: ${err.message}`);
    wizLog("instalação interrompida");
  }
}

/* ─────────── console ─────────── */
let con = { plugin: "pets", method: "handleCommand", out: null };

function viewConsole() {
  const head = pageHead("Console JSON-RPC", "A mesma conversa que o core tem com o plugin, escrita à mão.", "", "Desenvolvimento");
  const selected = plugins.find((p) => p.id === con.plugin) || plugins[0];
  const firstCmd = selected?.commands?.[0]?.name || "ping";
  const body = `<div class="cols"><section class="card">
      <div class="card-h"><h2>Requisição</h2><div style="display:flex;gap:7px;align-items:center"><select id="con-plugin" style="width:auto;max-width:160px;height:24px;padding:0 6px;font-size:12px">${plugins.map((p) => `<option value="${p.id}" ${con.plugin === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select><button class="btn sm pri" data-act="con-send">Executar</button></div></div>
      <div class="pad"><textarea id="con-req" rows="11" class="mono" style="font-family:var(--mono);font-size:11.5px;line-height:1.65" aria-label="Requisição JSON-RPC">${esc(JSON.stringify({
        jsonrpc: "2.0", id: 1, method: con.method,
        params: con.method === "handleCommand"
          ? { command: firstCmd, args: [], userId: "4410", guildId: curGuild, channelId: "9001" }
          : con.method === "handleEvent"
            ? { type: "MESSAGE_CREATE", guildId: curGuild, payload: { userId: "4410", content: "!pet", channelId: "9001" } }
            : { guildId: curGuild },
      }, null, 2))}</textarea>
      <p class="hint">Uma linha JSON por mensagem. A saída padrão carrega o protocolo; os logs vão para a saída de erro.</p></div>
    </section>
    <section class="card">
      <div class="card-h"><h2>Resposta</h2><span class="sub">${apiOnline ? "do plugin de verdade" : "simulada"}</span></div>
      <div class="pad"><pre id="con-out" style="min-height:210px">${con.out ? esc(con.out) : esc(JSON.stringify({ jsonrpc: "2.0", note: "envie uma requisição para ver a resposta" }, null, 2))}</pre>
      <p class="hint">O plugin devolve apenas intenções. O core confere a permissão e executa no Discord.</p></div>
    </section></div>`;
  return shell(head, body);
}

async function conSend() {
  con.plugin = $("#con-plugin").value;
  const req = JSON.parse($("#con-req").value);
  con.method = req.method;
  const p = plugins.find((x) => x.id === con.plugin);

  if (!apiOnline) {
    con.out = JSON.stringify({
      jsonrpc: "2.0", id: req.id,
      error: { code: -32000, message: "painel em modo demonstração: abra pela porta do core" },
    }, null, 2);
    return render();
  }

  if (!p?.enabled) {
    con.out = JSON.stringify({ jsonrpc: "2.0", id: req.id, error: { code: -32000, message: "E_PLUGIN_DISABLED" } }, null, 2);
    return render();
  }

  try {
    if (con.method === "handleCommand") {
      const res = await api(`/api/plugins/${con.plugin}/call`, {
        method: "POST",
        body: JSON.stringify({ method: "handleCommand", guildId: req.params.guildId, params: req.params }),
      });
      const msgs = (res.results?.[0]?.executed ?? []).map((e) => e.action);
      con.out = JSON.stringify({ jsonrpc: "2.0", id: req.id, result: msgs.length ? msgs : res, meta: { durationMs: res.results?.[0]?.durationMs } }, null, 2);
    } else if (con.method === "handleEvent") {
      const res = await api("/api/simulate/event", {
        method: "POST",
        body: JSON.stringify({ type: req.params.type, guildId: req.params.guildId, payload: req.params.payload }),
      });
      con.out = JSON.stringify({ jsonrpc: "2.0", id: req.id, result: res }, null, 2);
    } else {
      const res = await api(`/api/plugins/${con.plugin}/call`, {
        method: "POST",
        body: JSON.stringify({ method: con.method, guildId: req.params.guildId, params: req.params }),
      });
      con.out = JSON.stringify({ jsonrpc: "2.0", id: req.id, ...res }, null, 2);
    }
  } catch (err) {
    con.out = JSON.stringify({ jsonrpc: "2.0", id: req.id, error: { code: -32000, message: err.message } }, null, 2);
  }
  render();
}

    `<ul>
      <li><b>O comando não aparece no Discord.</b> O plugin está instalado <i>neste</i> servidor? Está ligado? Olhe a aba Comandos — se o comando está desligado ali, ele não existe.</li>

      <li><b>"capability não aprovada".</b> Você devolveu uma ação que não pediu no manifesto, ou o dono do servidor não aprovou. Peça a permissão certa.</li>
      <li><b>O processo morre sozinho.</b> Quase sempre é exceção não tratada em <code>handleCommand</code>. O core reinicia três vezes com espera e depois marca <code>degraded</code>. A aba Logs mostra o stderr do seu plugin.</li>
